<style>

<script>
'use strict';
// 单文件离线应用：每位学生独立存档；教师读取本浏览器记录或导入其他设备的学习报告。

const NAV=[['dashboard','◈','数据看板'],['employees','♙','员工档案'],['recruit','◎','招聘管理'],['schedule','▦','排班考勤'],['payroll','¥','薪酬核算'],['performance','↗','绩效管理'],['training','▤','培训管理'],['relations','◇','员工关系'],['tasks','⚑','情境任务'],['teacher','▥','教师端']];
let db,session=null,page='dashboard',filters={emp:'',dept:'',status:'',shiftDept:'前厅部',week:'2026-10-19',payDept:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function seed(){
 const names=['陈嘉宁','王晓雨','李晨','赵欣','周静','刘芳','张敏','吴佳','孙悦','何洁','郑涛','黄磊','林峰','徐凯','朱倩','马宁','胡晓','罗文','高婷','梁悦','宋雨','唐佳','许明','韩旭','冯佳','邓强','曹辉','彭晨','谢雯','蒋宁'];
 const specs=[['前厅部','前台接待',4300],['前厅部','礼宾员',3900],['前厅部','前台主管',6200],['前厅部','预订员',4200],['客房部','客房服务员',3800],['客房部','客房服务员',3800],['客房部','客房主管',5800],['客房部','公共区域保洁',3400],['客房部','客房服务员',3800],['客房部','洗衣房员工',3500],['餐饮部','餐厅服务员',3700],['餐饮部','宴会服务员',3800],['餐饮部','餐饮主管',6000],['厨房部','厨师',6500],['财务部','出纳',4800],['安保部','安保员',4100],['工程部','维修技工',5300],['工程部','工程主管',7000],['人力资源部','招聘专员',5000],['人力资源部','人事主管',6800]];
 const employees=Array.from({length:250},(_,i)=>{const s=specs[i%20];return{id:'E'+String(i+1).padStart(4,'0'),name:i<30?names[i]:names[i%30]+String(Math.floor(i/30)),dept:s[0],role:s[1],base:s[2],join:`${2020+i%6}-${String(i%12+1).padStart(2,'0')}-08`,status:i===1?'请假':'在职',contract:i<6?'2026-11-15':'2028-06-30',phone:'1380000'+String(i+1).padStart(4,'0'),score:i===4?62:75+i%21,interview:'',ot:i%5*2,night:i%4,attendance:i%17===0?'迟到':i%29===0?'漏打卡':'正常',attNote:'',exitStep:0};});
 const jobs=[['前台接待','前厅部',3],['客房服务员','客房部',4],['餐厅服务员','餐饮部',3],['维修技工','工程部',1],['安保员','安保部',2]].map((j,i)=>({id:'J'+i,title:j[0],dept:j[1],count:j[2],published:i!==0}));
 const candidates=Array.from({length:15},(_,i)=>({id:'C'+i,name:['许晴','顾远','沈佳','钱可','陆辰','孟欣','叶航','秦悦','白宁','贺云','方圆','杜青','石磊','江月','苏航'][i],job:i<6?'J0':'J'+(1+(i-6)%4),exp:i%4,skill:[90,84,48,78,55,92,88,73,67,86,52,91,80,70,95][i],score:0,stage:'待筛选',date:'',note:'',employeeId:''}));
 return{employees,jobs,candidates,shifts:{},pay:{performance:800,otRate:1.5,nightRate:60,monthlyHours:174,insurance:.105,taxFree:5000},performance:{},courses:[{id:'T1',title:'前厅服务与投诉处理',date:'2026-10-23',hours:3,capacity:40,teacher:'前厅经理',members:[],ratings:{}},{id:'T2',title:'客房清洁与安全操作',date:'2026-10-25',hours:4,capacity:50,teacher:'客房经理',members:[],ratings:{}},{id:'T3',title:'劳动合同与用工合规',date:'2026-10-28',hours:2,capacity:30,teacher:'人事主管',members:[],ratings:{}}],effects:{quality:0,turnover:0,service:0},taskResults:{},decisions:{},events:[]};
}
function init(){try{db=JSON.parse(localStorage.getItem(KEY));if(!db||db.version!==1)db=null;}catch(e){db=null;}if(!db)db={version:1,students:{},logs:[],assignments:[{id:'A0',title:'本节课完成四个业务情境，并导出学习报告。',date:TODAY}],reports:{}};renderLogin();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){toast('存储失败：请导出学习报告备份，检查浏览器存储空间。');return false;}}
function state(){return db.students[session.id].state;}function student(){return db.students[session.id];}
function log(action,detail){db.logs.push({id:uid(),time:new Date().toISOString(),student:session.id,name:session.name,action,detail});save();}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',4200);}
function modal(title,body,submit,label='保存'){const d=$('#modal');d.innerHTML=`<div class="dialogbody"><div class="dialoghead"><h2>${esc(title)}</h2><button class="secondary" data-close type="button" aria-label="关闭">✕</button></div><form id="modalform">${body}${submit?`<div class="row" style="justify-content:flex-end;margin-top:22px"><button type="button" class="secondary" data-close>取消</button><button type="submit">${esc(label)}</button></div>`:''}</form></div>`;d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close());if(submit)d.querySelector('form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));try{if(submit(values)!==false)d.close();}catch(err){toast('操作失败：'+err.message);}};d.showModal();}
function field(label,name,value='',type='text',extra=''){return `<label class="field">${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}function selectField(label,name,options,value){return `<label class="field">${esc(label)}<select name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;}
function renderLogin(){session=null;$('#app').innerHTML=`<div class="login"><section class="loginhero"><div style="color:var(--gold);letter-spacing:5px;margin-bottom:28px">LANTING HOTEL · HR LAB</div><h1>服务，从每一位<br>员工开始。</h1><p>澜庭酒店人力资源教学仿真系统</p><div class="row" style="margin:30px 0"><span>300 间客房</span> · <span>250 名员工</span> · <span>全服务酒店</span></div><p class="smalltext">在真实业务情境中练习招聘、排班、薪酬与员工关系。<br>所有人物与数据均为教学模拟。</p></section><section class="loginbox"><h2>进入人力资源工作台</h2><p class="muted">选择身份，开始本次课堂实训</p><div class="tabs"><button id="studentTab">学生实训</button><button class="secondary" id="teacherTab">教师管理</button></div><form id="loginform"></form><div class="notice smalltext" style="margin-top:24px">离线教学版 · 数据保存在当前浏览器。不同设备请通过“导出学习报告 / 教师导入”汇总；无实时联网同步。教学业务日期固定为 ${TODAY}。</div></section></div>`;let mode='student';function paint(){const t=mode==='teacher';$('#loginform').innerHTML=t?field('教师账号','name','teacher')+field('密码','id','','password','required')+'<p class="smalltext muted">教学演示账号：teacher / Hotel2026!</p><button style="width:100%">登录教师端</button>':field('姓名','name','','text','required maxlength="30" placeholder="请输入真实姓名"')+field('学号','id','','text','required maxlength="40" pattern="[A-Za-z0-9_-]+" placeholder="学号：字母、数字、下划线或短横线"')+'<button style="width:100%">进入我的酒店</button>';$('#studentTab').className=t?'secondary':'';$('#teacherTab').className=t?'':'secondary';}$('#studentTab').onclick=()=>{mode='student';paint();};$('#teacherTab').onclick=()=>{mode='teacher';paint();};paint();$('#loginform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),id=f.get('id').trim();if(mode==='teacher'){if(name!=='teacher'||id!=='Hotel2026!')return toast('教师账号或密码错误');session={teacher:true,name:'授课教师',id:'teacher'};page='teacher';}else{if(!name||!id)return toast('请填写姓名与学号');if(['__proto__','constructor','prototype'].includes(id))return toast('请使用其他学号');if(!Object.hasOwn(db.students,id))db.students[id]={id,name,state:seed()};else if(db.students[id].name!==name)return toast('该学号已绑定其他姓名，请核对输入');session={teacher:false,id,name};page='dashboard';save();log('登录','进入学生工作台');}render();};}
function render(){const teacher=session.teacher;$('#app').innerHTML=`<aside><div class="brand">澜庭酒店<small>HUMAN RESOURCES LAB</small></div><nav>${NAV.filter(n=>teacher?n[0]==='teacher':n[0]!=='teacher').map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}">${n[1]}　${n[2]}</button>`).join('')}</nav><div class="navfoot">教学模拟 · 非生产系统<br>300 ROOMS / FULL SERVICE<br><br>业务日期 ${TODAY}<br>个人存档 · 自动保存</div></aside><header><div class="row"><button class="secondary mobile" id="menuBtn">☰</button><b>${teacher?'课堂教学控制台':'人力资源管理工作台'}</b><span class="badge">${teacher?'教师模式':'学生实训'}</span></div><div class="row"><span>${esc(session.name)}${teacher?'':' · '+esc(session.id)}</span>${!teacher?'<button class="small secondary" id="exportBtn">导出学习报告</button>':''}<button class="small secondary" id="logoutBtn">退出</button></div></header><main id="content"></main>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logoutBtn').onclick=()=>{if(confirm('退出当前账号？数据已自动保存在本浏览器。')){document.body.classList.remove('menu');renderLogin();}};if($('#menuBtn'))$('#menuBtn').onclick=()=>document.body.classList.toggle('menu');if($('#exportBtn'))$('#exportBtn').onclick=exportReport;renderPage();}
function go(p){page=p;document.body.classList.remove('menu');render();}function title(t,sub,actions=''){return `<div class="titleline"><div><h1>${t}</h1><p class="muted">${sub}</p></div><div class="row">${actions}</div></div>`;}function renderPage(){const fn={dashboard:dashboard,employees:employees,recruit:recruit,schedule:schedule,payroll:payroll,performance:performance,training:training,relations:relations,tasks:tasks,teacher:teacher};fn[page]();}
function metrics(){const s=state(),active=s.employees.filter(e=>e.status!=='离职'),onsite=active.filter(e=>e.status==='在职'),hired=s.candidates.filter(c=>c.stage==='已录用').length,need=s.jobs.reduce((a,j)=>a+j.count,0),exit=s.employees.length-active.length;return{active:active.length,onsite:onsite.length,ratio:(active.length/300).toFixed(2),cost:active.reduce((a,e)=>a+calcPay(e).gross,0)/3800000*100,turnover:(6+exit+s.effects.turnover)/((250+active.length)/2)*100,hired,need};}
function dashboard(){const s=state(),m=metrics();$('#content').innerHTML=title('数据看板','掌握酒店人力配置，观察业务决策带来的变化')+`<div class="cards">${[['人力成本率',m.cost.toFixed(1)+'%','月工资 / 模拟营收 380万元'],['本月流失率',m.turnover.toFixed(1)+'%','月离职人数 / 月均人数'],['人房比',m.ratio,'在册非离职员工 / 300间'],['当前在岗',m.onsite+'人','在职 '+m.active+'人 · 扣除请假'],['招聘完成率',(m.hired/m.need*100).toFixed(0)+'%',m.hired+' / '+m.need+' 个计划名额']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div><div class="smalltext muted">${x[2]}</div></div>`).join('')}</div><div class="grid" style="margin-top:20px"><section class="card"><h3>各部门人员配置</h3>${DEPTS.map(d=>{let n=s.employees.filter(e=>e.dept===d&&e.status!=='离职').length;return `<div class="chartrow"><span>${d}</span><div class="bar"><span style="width:${Math.min(n/80*100,100)}%"></span></div><b>${n}人</b></div>`;}).join('')}</section><section class="card"><h3>课堂任务与决策影响</h3><div class="score">${totalScore(s)} <small style="font-size:14px">/ 400 分</small></div><p class="muted">完成 ${Object.keys(s.taskResults).length} / 4 个情境任务</p><div class="bar"><span style="width:${Object.keys(s.taskResults).length/4*100}%"></span></div><p style="margin-top:20px">服务质量指数 <b>${Math.max(0,Math.min(100,90+s.effects.service))}</b> / 100</p><p class="smalltext muted">录用低匹配候选人会降低服务质量，并增加模拟流失风险；分数计入绩效。流失率包含风险情境人数，非真实预测。</p><button onclick="go('tasks')">查看情境任务 →</button><h3 style="margin-top:25px">教师任务通知</h3>${db.assignments.map(a=>`<div class="notice smalltext">${esc(a.title)}<br><span class="muted">${esc(a.date)}</span></div>`).join('')}</section></div><section class="card" style="margin-top:20px"><h3>业务动态</h3>${s.events.length?s.events.slice(-6).reverse().map(x=>`<p>· ${esc(x)}</p>`).join(''):'<p class="muted">暂无业务动态，开始完成情境任务吧。</p>'}</section><footer>统计口径：初始月初在册250人，前期模拟离职6人；工资为教学测算，税费与劳动规则采用简化模型。</footer>`;}
function totalScore(s){return Object.values(s.taskResults).reduce((a,r)=>a+r.score,0);}function event(t){state().events.push(t);}
function employees(){const s=state(),list=s.employees.filter(e=>(e.name+e.id+e.role).toLowerCase().includes(filters.emp.toLowerCase())&&(!filters.dept||e.dept===filters.dept)&&(!filters.status||e.status===filters.status));$('#content').innerHTML=title('员工档案','250人初始全量数据 · 每位学生拥有独立酒店存档','<button onclick="editEmployee()">＋ 新增员工</button>')+`<section class="card"><div class="row" style="margin-bottom:18px"><input id="empSearch" placeholder="搜索姓名 / 工号 / 岗位" value="${esc(filters.emp)}"><select id="empDept"><option value="">所有部门</option>${DEPTS.map(d=>`<option ${filters.dept===d?'selected':''}>${d}</option>`).join('')}</select><select id="empStatus"><option value="">所有状态</option>${['在职','请假','离职'].map(d=>`<option ${filters.status===d?'selected':''}>${d}</option>`).join('')}</select><span class="muted">共 ${list.length} 人</span></div><div class="tablewrap"><table><thead><tr>${['工号','姓名','部门','岗位','入职日期','状态','操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${list.map(e=>`<tr><td>${e.id}</td><td><b>${esc(e.name)}</b></td><td>${e.dept}</td><td>${esc(e.role)}</td><td>${e.join}</td><td><span class="badge ${e.status==='离职'?'bad':e.status==='请假'?'warn':''}">${e.status}</span></td><td><div class="row"><button class="small secondary" onclick="employeeDetail('${e.id}')">详情</button><button class="small secondary" onclick="editEmployee('${e.id}')">编辑</button><button class="small danger" onclick="deleteEmployee('${e.id}')">删除</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配员工</td></tr>'}</tbody></table></div></section>`;$('#empSearch').onchange=e=>{filters.emp=e.target.value;employees();};$('#empDept').onchange=e=>{filters.dept=e.target.value;employees();};$('#empStatus').onchange=e=>{filters.status=e.target.value;employees();};}
function editEmployee(id){const s=state(),e=s.employees.find(x=>x.id===id)||{name:'',dept:'前厅部',role:'前台接待',base:4300,join:TODAY,status:'在职',contract:'2028-10-19',phone:''};modal(id?'编辑员工':'新增员工',`<div class="formgrid">${field('姓名','name',e.name,'text','required maxlength="30"')}${selectField('部门','dept',DEPTS,e.dept)}${field('岗位','role',e.role,'text','required maxlength="40"')}${field('岗位月工资（元）','base',e.base,'number','min="2000" max="100000" required')}${field('入职日期','join',e.join,'date','required')}${field('合同到期日','contract',e.contract,'date','required')}${selectField('员工状态','status',['在职','请假','离职'],e.status)}${field('联系电话','phone',e.phone,'tel','maxlength="20"')}</div>`,v=>{if(v.contract<v.join){toast('合同到期日不能早于入职日期');return false;}if(!v.name.trim()||!v.role.trim()){toast('姓名和岗位不能为空');return false;}if(id)Object.assign(e,v,{base:+v.base});else{s.employees.push({...v,id:'E'+uid().toUpperCase(),base:+v.base,score:80,interview:'',ot:0,night:0,attendance:'正常',attNote:'',exitStep:0});}log(id?'编辑员工':'新增员工',v.name+' / '+v.dept);renderPage();});}

function deleteEmployee(id){const s=state(),e=s.employees.find(x=>x.id===id);if(id==='E0002'||id==='E0005'||id==='E0011'||s.candidates.some(c=>c.employeeId===id))return toast('该员工关联情境任务或录用记录，请通过员工状态及离职流程管理');if(!confirm('确定删除 '+e.name+' 的档案？此操作不会清除历史操作日志。'))return;s.employees=s.employees.filter(x=>x.id!==id);log('删除员工',e.name);employees();}
function recruit(){const s=state();$('#content').innerHTML=title('招聘管理','发布职位 → 简历筛选 → 面试安排 → 录用审批','<button onclick="editJob()">＋ 新建职位</button>')+`<div class="grid">${s.jobs.map(j=>{const n=s.candidates.filter(c=>c.job===j.id&&c.stage==='已录用').length;return `<section class="card"><div class="row between"><h3>${esc(j.title)}</h3><span class="badge ${j.published?'':'warn'}">${j.published?'已发布':'待发布'}</span></div><p class="muted">${j.dept} · 需求 ${j.count}人 · 已录用 ${n}人</p><div class="row"><button class="small" onclick="publishJob('${j.id}')">${j.published?'暂停发布':'发布职位'}</button><button class="small secondary" onclick="editJob('${j.id}')">编辑</button></div></section>`;}).join('')}</div><section class="card" style="margin-top:20px"><h3>候选人流程看板</h3><div class="notice smalltext">前台接待推荐：技能 ≥ 75、相关经验 ≥ 1年。每人请独立打分；录用不合格者会产生服务质量与流失连锁反应。</div><div class="tablewrap"><table><thead><tr><th>候选人</th><th>应聘岗位</th><th>经验 / 技能</th><th>筛选分</th><th>进度</th><th>面试时间</th><th>操作</th></tr></thead><tbody>${s.candidates.map(c=>{const j=s.jobs.find(j=>j.id===c.job);return `<tr><td>${esc(c.name)}</td><td>${esc(j.title)}</td><td>${c.exp}年 / ${c.skill}</td><td>${c.score||'—'}</td><td><span class="badge ${c.stage==='已淘汰'?'bad':''}">${c.stage}</span></td><td>${esc(c.date.replace('T',' ')||'待安排')}</td><td>${c.stage==='待筛选'?`<button class="small" onclick="screenCandidate('${c.id}')">筛选评分</button>`:c.stage==='筛选通过'?`<button class="small" onclick="arrangeInterview('${c.id}')">安排面试</button>`:c.stage==='待面试'?`<button class="small" onclick="interviewResult('${c.id}')">记录面试</button>`:c.stage==='待录用审批'?`<button class="small" onclick="hire('${c.id}')">录用审批</button>`:esc(c.note||'流程完成')}</td></tr>`;}).join('')}</tbody></table></div></section>`;}
function editJob(id){const s=state(),j=s.jobs.find(j=>j.id===id)||{title:'',dept:'前厅部',count:1};modal('招聘职位',field('职位名称','title',j.title,'text','required maxlength="40"')+selectField('部门','dept',DEPTS,j.dept)+field('招聘人数','count',j.count,'number','required min="1" max="30"'),v=>{if(!v.title.trim())return false;const hired=id?s.candidates.filter(c=>c.job===id&&c.stage==='已录用').length:0;if(+v.count<hired){toast('计划人数不能小于已录用人数');return false;}if(id)Object.assign(j,v,{count:+v.count});else s.jobs.push({...v,count:+v.count,id:uid(),published:false});log('维护职位',v.title+' / '+v.count+'人');recruit();});}
function publishJob(id){const j=state().jobs.find(j=>j.id===id);if(!confirm((j.published?'暂停':'确认发布')+'职位：'+j.title+'？'))return;j.published=!j.published;log('职位发布',j.title+' / '+(j.published?'发布':'暂停'));recruit();toast('职位状态已更新');}
function screenCandidate(id){const s=state(),c=s.candidates.find(c=>c.id===id),j=s.jobs.find(j=>j.id===c.job);if(!j.published)return toast('请先发布该招聘职位');modal('筛选简历 · '+c.name,`<div class="notice">相关经验 ${c.exp} 年；岗位技能测评 ${c.skill}/100。${c.skill<60?'服务能力存在明显短板。':'具备一定岗位服务基础。'}</div>`+field('筛选评分（0—100）','score',80,'number','required min="0" max="100"')+selectField('筛选结论','decision',['通过','淘汰'],'通过')+'<label class="field">判断依据<textarea name="note" required minlength="5" maxlength="500" placeholder="结合岗位要求说明判断依据"></textarea></label>',v=>{Object.assign(c,{score:+v.score,stage:v.decision==='通过'?'筛选通过':'已淘汰',note:v.note});log('简历筛选',c.name+' / '+v.decision+' / '+v.score+'分 / '+v.note);recruit();toast('筛选结果已保存');});}
function arrangeInterview(id){const c=state().candidates.find(c=>c.id===id);modal('安排面试 · '+c.name,field('面试时间（模拟业务时间）','date','2026-10-22T10:00','datetime-local','required min="2026-10-20T00:00"')+field('面试官 / 地点','note','前厅经理 / 酒店会议室','text','required maxlength="150"'),v=>{Object.assign(c,v,{stage:'待面试'});log('安排面试',c.name+' / '+v.date+' / '+v.note);recruit();});}
function interviewResult(id){const c=state().candidates.find(c=>c.id===id);modal('面试评价 · '+c.name,`<p>候选人技能 ${c.skill} 分，相关经验 ${c.exp} 年。请依据服务能力、沟通能力及岗位匹配度判断。</p>`+selectField('面试结果','result',['通过，提交录用审批','未通过，淘汰'])+'<label class="field">面试记录<textarea name="note" minlength="5" required maxlength="500"></textarea></label>',v=>{c.stage=v.result.startsWith('通过')?'待录用审批':'已淘汰';c.note=v.note;log('面试评价',c.name+' / '+v.result+' / '+v.note);recruit();});}
function hire(id){const s=state(),c=s.candidates.find(c=>c.id===id),j=s.jobs.find(j=>j.id===c.job);if(c.stage!=='待录用审批')return;if(s.candidates.filter(c=>c.job===j.id&&c.stage==='已录用').length>=j.count)return toast('此职位录用人数已达到计划');if(!confirm('审批通过并录用 '+c.name+'？将生成员工档案并影响人力成本。'))return;const qualified=c.skill>=75&&c.exp>=1,eid='E'+uid().toUpperCase();c.stage='已录用';c.employeeId=eid;s.employees.push({id:eid,name:c.name,dept:j.dept,role:j.title,base:4300,join:TODAY,status:'在职',contract:'2028-10-19',phone:'',score:qualified?85:55,interview:'',ot:0,night:0,attendance:'正常',attNote:'',exitStep:0});if(!qualified){s.effects.service-=5;s.effects.turnover+=1;event(c.name+' 岗位匹配不足：试用期绩效55分，服务指数下降5，模拟流失风险增加1人。');}else{event(c.name+' 录用成功，试用期初始绩效85分。');}log('录用审批',c.name+' / '+(qualified?'岗位匹配':'匹配不足，产生连锁反应'));recruit();toast(qualified?'已录用并建立档案':'已录用：匹配不足，服务质量与流失风险指标已变化');}
// 排班按部门和周独立保存，周一至周日；夜班后早班、连续7天、请假排班均提示冲突。
function weekDates(){const d=new Date(filters.week+'T12:00:00Z');return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setUTCDate(d.getUTCDate()+i);return x.toISOString().slice(0,10);});}
function shifts(e){const s=state(),k=filters.week+'_'+e.id;if(!s.shifts[k])s.shifts[k]=Array.from({length:7},(_,i)=>e.id==='E0002'?['早班','夜班','休','早班','中班','休','早班'][i]:['早班','中班','夜班','休','早班','中班','休'][(i+Number(e.id.replace(/\D/g,'').slice(-2)||0))%7]);return s.shifts[k];}
function conflicts(list){let out=[];list.forEach(e=>{const a=shifts(e);if(e.status==='请假'&&a.some(x=>x!=='休'))out.push(e.name+' 请假中仍有排班');for(let i=1;i<7;i++)if(a[i-1]==='夜班'&&a[i]==='早班')out.push(e.name+' '+weekDates()[i]+' 夜班后接早班');if(a.every(x=>x!=='休'))out.push(e.name+' 连续7天无休息');});for(let i=0;i<7;i++)if(!list.some(e=>e.status==='在职'&&shifts(e)[i]==='夜班'))out.push(weekDates()[i]+' 夜班无人值守');return out;}
function schedule(){const s=state(),list=s.employees.filter(e=>e.dept===filters.shiftDept&&e.status!=='离职'),issues=conflicts(list);save();$('#content').innerHTML=title('排班考勤','早班 07:00–15:00 · 中班 15:00–23:00 · 夜班 23:00–次日07:00')+`<div class="notice warning">任务2：王晓雨（E0002）本周请假。请将其本周排班全部设为“休”，安排其他在职同事补足周二夜班，并为实际加班员工记录至少8小时加班。排班与薪酬按本月教学场景关联，夜班数取已保存周排班合计。</div><section class="card"><div class="row" style="margin-bottom:18px"><select id="shiftDept">${DEPTS.map(d=>`<option ${d===filters.shiftDept?'selected':''}>${d}</option>`).join('')}</select><label>周一日期 <input type="date" id="week" value="${filters.week}"></label><span class="badge ${issues.length?'warn':''}">${issues.length} 项排班提醒</span></div><div class="tablewrap"><table><thead><tr><th>员工 / 状态</th>${weekDates().map((d,i)=>`<th>${['一','二','三','四','五','六','日'][i]}<br>${d.slice(5)}</th>`).join('')}<th>加班时数</th></tr></thead><tbody>${list.map(e=>`<tr><td>${esc(e.name)}<br><span class="muted">${e.id} · ${e.status}</span></td>${shifts(e).map((a,i)=>`<td><select class="shift" data-s="${a}" onchange="changeShift('${e.id}',${i},this.value)">${['早班','中班','夜班','休'].map(x=>`<option ${x===a?'selected':''}>${x}</option>`).join('')}</select></td>`).join('')}<td><button class="small secondary" onclick="editOvertime('${e.id}')">${e.ot} 小时 · 调整</button></td></tr>`).join('')}</tbody></table></div></section><section class="card"><h3>排班冲突检测</h3>${issues.length?issues.slice(0,30).map(x=>`<p class="smalltext">⚠ ${esc(x)}</p>`).join(''):'<p class="done">当前部门本周无检测到的冲突。</p>'}<p class="smalltext muted">教学校验：请假排班、夜转早、连续7天、每日夜班空缺。人数与休息间隔规则为简化情境。</p></section><section class="card"><h3>本月考勤异常</h3><div class="tablewrap"><table><thead><tr><th>员工</th><th>部门</th><th>异常类型</th><th>处理记录</th><th>操作</th></tr></thead><tbody>${s.employees.filter(e=>e.attendance!=='正常'&&e.status!=='离职').map(e=>`<tr><td>${esc(e.name)}</td><td>${e.dept}</td><td><span class="badge warn">${e.attendance}</span></td><td>${esc(e.attNote||'待核实')}</td><td><button class="small secondary" onclick="attendance('${e.id}')">核实处理</button></td></tr>`).join('')||'<tr><td colspan="5">暂无待处理异常</td></tr>'}</tbody></table></div><button class="secondary" style="margin-top:16px" onclick="addAttendance()">登记考勤异常</button></section>`;$('#shiftDept').onchange=e=>{filters.shiftDept=e.target.value;schedule();};$('#week').onchange=e=>{if(!e.target.value)return;const date=new Date(e.target.value+'T12:00:00Z');if(date.getUTCDay()!==1){toast('请选择周一作为起始日期');e.target.value=filters.week;return;}filters.week=e.target.value;schedule();};}
function changeShift(id,i,value){const e=state().employees.find(e=>e.id===id);shifts(e)[i]=value;log('调整排班',e.name+' / '+weekDates()[i]+' / '+value);schedule();}
function editOvertime(id){const e=state().employees.find(e=>e.id===id);modal('加班记录 · '+e.name,field('本月平日延时加班时数','ot',e.ot,'number','required min="0" max="80" step="0.5"')+'<label class="field">加班原因 / 审批依据<textarea name="reason" required minlength="5" maxlength="300"></textarea></label>',v=>{e.ot=+v.ot;e.otReason=v.reason;log('加班登记',e.name+' / '+v.ot+'小时 / '+v.reason);renderPage();toast('加班记录已关联薪酬计算');});}
function attendance(id){const e=state().employees.find(e=>e.id===id);modal('考勤核实 · '+e.name,selectField('处理结果','result',['核实正常，撤销异常','异常属实，保留记录'])+'<label class="field">核实说明<textarea name="note" minlength="5" maxlength="300" required></textarea></label>',v=>{e.attNote=v.note;if(v.result.startsWith('核实正常'))e.attendance='正常';log('考勤核实',e.name+' / '+v.result+' / '+v.note);schedule();});}
function addAttendance(){modal('登记考勤异常',employeeSelect('员工','employee')+selectField('异常类型','type',['迟到','早退','漏打卡','旷工'])+'<label class="field">说明<textarea name="note" required maxlength="300"></textarea></label>',v=>{const e=state().employees.find(e=>e.id===v.employee);e.attendance=v.type;e.attNote=v.note;log('考勤异常登记',e.name+' / '+v.type);schedule();});}
// 薪酬模型：平日延时加班按月计薪174小时折算；简化预扣税仅用于教学，不构成工资结算依据。
function nightCount(e){const entries=Object.entries(state().shifts).filter(([k])=>k.startsWith(MONTH)&&k.endsWith('_'+e.id));return entries.length?entries.reduce((a,[k,v])=>a+v.filter(s=>s==='夜班').length,0):e.night;}
function calcPay(e){const p=state().pay,perf=p.performance*e.score/100,ot=e.base/p.monthlyHours*p.otRate*e.ot,night=nightCount(e)*p.nightRate,gross=e.base+perf+ot+night,insurance=e.base*p.insurance,tax=Math.max(0,gross-insurance-p.taxFree)*.03;return{perf,ot,night,gross,insurance,tax,net:gross-insurance-tax};}
function payroll(){const s=state(),p=s.pay,list=s.employees.filter(e=>e.status!=='离职'&&(!filters.payDept||e.dept===filters.payDept));$('#content').innerHTML=title('薪酬核算',MONTH+' 月 · 调整参数，实时观察工资与人力成本变化','<button onclick="exportPayroll()">导出工资表 CSV</button>')+`<section class="card"><h3>核算参数</h3><form id="payform"><div class="formgrid">${field('绩效奖金基数（元）','performance',p.performance,'number','required min="0" max="20000"')}${field('平日延时加班倍率','otRate',p.otRate,'number','required min="1.5" max="3" step="0.1"')}${field('夜班补贴（元/班）','nightRate',p.nightRate,'number','required min="0" max="500"')}${field('月计薪小时','monthlyHours',p.monthlyHours,'number','required min="100" max="250"')}${field('个人社保比例（0—0.3）','insurance',p.insurance,'number','required min="0" max="0.3" step="0.001"')}${field('模拟免征额（元）','taxFree',p.taxFree,'number','required min="0" max="10000"')}</div><button>应用参数并重算</button></form></section><div class="notice smalltext">应发 = 岗位工资 + 奖金基数 × 绩效分/100 + 岗位工资÷月计薪小时×倍率×加班时数 + 夜班数×补贴。实发 = 应发 − 岗位工资×社保比例 − max(0,应发−社保−免征额)×3%。请假、考勤扣款、累计税额和公积金未纳入。夜班取本月已保存各周排班，未排班员工使用预置数；该模型仅用于教学。</div><section class="card"><div class="row between"><h3>工资明细 · ${list.length}人</h3><select id="payDept"><option value="">所有部门</option>${DEPTS.map(d=>`<option ${d===filters.payDept?'selected':''}>${d}</option>`).join('')}</select></div><p>应发合计 <b>${money(list.reduce((a,e)=>a+calcPay(e).gross,0))}</b>　实发合计 <b>${money(list.reduce((a,e)=>a+calcPay(e).net,0))}</b></p><div class="tablewrap"><table><thead><tr>${['员工','岗位工资','绩效奖金','加班费','夜班补贴','应发','社保','模拟税','实发','操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${list.map(e=>{const c=calcPay(e);return `<tr><td>${esc(e.name)}<br><small class="muted">${e.dept}</small></td><td>${money(e.base)}</td>${['perf','ot','night','gross','insurance','tax','net'].map(k=>`<td>${money(c[k])}</td>`).join('')}<td><button class="small secondary" onclick="editOvertime('${e.id}')">加班 ${e.ot}h</button></td></tr>`;}).join('')}</tbody></table></div></section>`;$('#payform').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));Object.keys(values).forEach(k=>p[k]=+values[k]);log('调整薪酬参数',JSON.stringify(p));payroll();toast('工资已重新计算，看板人力成本同步变化');};$('#payDept').onchange=e=>{filters.payDept=e.target.value;payroll();};}
function exportPayroll(){const rows=[['工号','姓名','部门','岗位工资','绩效奖金','加班费','夜班补贴','应发','社保','模拟税','实发'],...state().employees.filter(e=>e.status!=='离职').map(e=>{const c=calcPay(e);return[e.id,e.name,e.dept,e.base,...['perf','ot','night','gross','insurance','tax','net'].map(k=>c[k].toFixed(2))];})];download('澜庭酒店_工资表.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');log('导出工资表',MONTH);}

function grade(score){return score>=90?'A 优秀':score>=80?'B 良好':score>=70?'C 合格':score>=60?'D 待改进':'E 不合格';}
function performance(){const s=state();$('#content').innerHTML=title('绩效管理','设定可衡量的KPI → 评价打分 → 绩效面谈','<button onclick="editPerformance()">＋ 员工考核 / 面谈</button>')+`<div class="notice">任务3：周静（E0005）前期绩效62分。客房抽检从92分降至76分，投诉2次，技能测试80分。请针对周静完成三项KPI评分，记录原因分析、改进措施和复盘日期。</div><section class="card"><h3>已完成考核</h3><div class="tablewrap"><table><thead><tr><th>员工</th><th>综合分</th><th>等级</th><th>KPI设置与权重</th><th>面谈要点</th><th>操作</th></tr></thead><tbody>${Object.entries(s.performance).filter(([id])=>s.employees.some(e=>e.id===id)).map(([id,r])=>{const e=s.employees.find(e=>e.id===id);return `<tr><td>${esc(e.name)} / ${e.id}</td><td>${r.score}</td><td><span class="badge">${grade(r.score)}</span></td><td class="log">${r.kpis.map(k=>`${esc(k.name)} ${k.weight}% / ${k.score}分`).join('<br>')}</td><td class="log">${esc(r.note)}</td><td><button class="small secondary" onclick="editPerformance('${id}')">编辑</button></td></tr>`;}).join('')||'<tr><td colspan="6" class="empty">尚未完成考核，点击右上角开始</td></tr>'}</tbody></table></div></section>`;}

function training(){const s=state();$('#content').innerHTML=title('培训管理','报名与出勤 · 培训效果评价 · 培训档案')+`<div class="grid">${s.courses.map(c=>`<section class="card"><span class="badge">${c.date}</span><h3 style="margin-top:12px">${esc(c.title)}</h3><p class="muted">${esc(c.teacher)} · ${c.hours} 学时 · 已报名 ${c.members.length}/${c.capacity}人</p><button onclick="enroll('${c.id}')">员工报名</button><div style="margin-top:18px">${c.members.map(id=>{const e=s.employees.find(e=>e.id===id);if(!e)return '';return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(e.name)} <span class="muted">${c.ratings[id]===undefined?'待出勤与评估':c.ratings[id]+'分 · 完成'}</span></span><div class="row"><button class="small secondary" onclick="rateTraining('${c.id}','${id}')">评估</button><button class="small danger" onclick="cancelEnroll('${c.id}','${id}')">取消</button></div></div>`;}).join('')||'<p class="muted smalltext">暂无报名记录</p>'}</div></section>`).join('')}</div>`;}
function enroll(id){const c=state().courses.find(c=>c.id===id);modal('培训报名 · '+c.title,employeeSelect('报名员工','employee'),v=>{if(c.members.includes(v.employee)){toast('该员工已报名');return false;}if(c.members.length>=c.capacity){toast('课程已满');return false;}c.members.push(v.employee);log('培训报名',c.title+' / '+v.employee);training();});}
function cancelEnroll(id,eid){if(!confirm('取消此员工报名与评估记录？'))return;const c=state().courses.find(c=>c.id===id);c.members=c.members.filter(x=>x!==eid);delete c.ratings[eid];log('取消培训报名',c.title+' / '+eid);training();}
function rateTraining(id,eid){const c=state().courses.find(c=>c.id===id);modal('记录出勤与培训评价',`<p>本操作模拟培训已完成后的出勤与测评，不受实际日期限制。</p>`+selectField('出勤状态','att',['完成课程','缺席'])+field('培训后测评得分','score',c.ratings[eid]??85,'number','required min="0" max="100"'),v=>{if(v.att==='缺席'){delete c.ratings[eid];}else c.ratings[eid]=+v.score;log('培训效果评估',c.title+' / '+eid+' / '+v.att+' / '+v.score);training();toast('培训记录已保存');});}

function renew(id){const e=state().employees.find(e=>e.id===id);modal('合同续签 · '+e.name,field('新的合同到期日','contract','2028-11-15','date','required min="2026-11-20"'),v=>{if(v.contract<=e.contract){toast('新到期日应晚于原到期日');return false;}e.contract=v.contract;log('合同续签',e.name+' / '+v.contract);relations();});}

function dispute(){const s=state();if(s.decisions.dispute){const d=s.decisions.dispute;modal('争议处理反馈',`<p>${esc(d.feedback)}</p><p class="muted">为保留决策后果，此情境按首次选择计分。</p>`);return;}modal('选择加班争议处理方案',`<label class="field">处理方案<select name="choice"><option value="A">A · 未经书面审批，一律拒绝支付</option><option value="B">B · 核实证据，按150%补发并完善审批制度</option><option value="C">C · 仅安排等时调休，要求员工放弃工资</option></select></label><label class="field">决策理由<textarea name="reason" minlength="10" maxlength="500" required></textarea></label><p class="muted smalltext">提交即锁定首次选择，并触发相应业务后果。</p>`,v=>{if(!confirm('确认提交此争议处理方案？首次选择用于情境评分。'))return false;const good=v.choice==='B',feedback=good?'核实并补发已确认的加班费，争议缓解；20小时已登记到郑涛工资。知识点：平日延时加班不因内部审批缺失当然免除工资责任。':'处理方案缺乏充分合规依据，争议升级，服务指数下降3，模拟流失风险增加1人。知识点：平日延时加班不应简单以调休替代法定加班工资。';s.decisions.dispute={choice:v.choice,reason:v.reason,feedback};if(good){const e=s.employees.find(e=>e.id==='E0011');e.ot=Math.max(e.ot,20);e.otReason='争议核实：20小时平日延时加班';}else{s.effects.service-=3;s.effects.turnover++;}event(feedback);log('劳动争议决策',v.choice+' / '+v.reason+' / '+feedback);relations();modal('决策后果',`<p>${esc(feedback)}</p>`);return false;},'提交决策');}

function taskDefs(){return[{id:'task1',title:'旺季前招聘',sub:'前厅部缺3名接待，需要在旺季前完成录用。',steps:['发布前厅部前台接待职位','至少筛选3份简历并记录依据','安排面试并记录面试评价','完成3名接待录用审批'],pages:['recruit'],knowledge:'按岗位胜任力筛选；招聘质量同时影响服务、绩效和流失。'},{id:'task2',title:'排班冲突处理',sub:'王晓雨请假，前厅部周二夜班出现空缺。',steps:['查看10月19日这一周的前厅排班','将王晓雨本周所有班次调整为休','安排在职同事补足周二夜班，且其无夜转早/连续7天冲突','为周二替班员工登记至少8小时加班'],pages:['schedule','payroll'],knowledge:'请假替班需同时核对休息安排、覆盖人数与工资补偿。'},{id:'task3',title:'绩效面谈',sub:'周静（E0005）客房质量下降，需要支持性的绩效面谈。',steps:['设置3项KPI且权重合计100%','依据抽检76、服务70、技能80分完成评价','记录原因、改进措施、复盘日期与面谈纪要'],pages:['performance'],knowledge:'评价以证据为基础，面谈应形成可执行改进计划和复盘机制。'},{id:'task4',title:'离职与劳动争议',sub:'郑涛提出离职，并就20小时延时加班工资提出争议。',steps:['提交离职申请并完成工作交接','选择争议方案并说明理由','完成工资结算与离职证明'],pages:['relations'],knowledge:'离职与工资结算应按法定程序办理；加班事实与内部审批需分别判断。'}];}
function taskProgress(id){const s=state();if(id==='task1'){const j=s.jobs.find(j=>j.id==='J0'),cs=s.candidates.filter(c=>c.job==='J0'),hi=cs.filter(c=>c.stage==='已录用');return{checks:[j.published,cs.filter(c=>c.score>0).length>=3,hi.length>=3&&hi.every(c=>c.date),hi.length>=3],score:Math.min(100,40+hi.filter(c=>c.skill>=75&&c.exp>=1).length*20)};}if(id==='task2'){const e=s.employees.find(e=>e.id==='E0002'),a=s.shifts['2026-10-19_'+e.id],others=s.employees.filter(e=>e.dept==='前厅部'&&e.status==='在职'),cover=others.filter(e=>s.shifts['2026-10-19_'+e.id]?.[1]==='夜班'),valid=cover.filter(e=>{const a=s.shifts['2026-10-19_'+e.id];return !a.every(x=>x!=='休')&&!a.some((x,i)=>i>0&&a[i-1]==='夜班'&&x==='早班');});return{checks:[!!a,!!a&&a.every(x=>x==='休'),valid.length>0,valid.some(e=>e.ot>=8&&e.otReason)],score:100};}if(id==='task3'){const r=s.performance.E0005;const evidence=r?Math.max(0,1-(Math.abs(r.kpis[0].score-76)+Math.abs(r.kpis[1].score-70)+Math.abs(r.kpis[2].score-80))/100):0;return{checks:[!!r&&r.kpis.reduce((a,k)=>a+k.weight,0)===100,!!r,!!r&&r.cause.length>=8&&r.action.length>=10&&r.note.length>=15&&r.review>TODAY],score:Math.round(70+30*evidence)};}const e=s.employees.find(e=>e.id==='E0011');return{checks:[e.exitStep>=2,!!s.decisions.dispute,e.exitStep===4],score:s.decisions.dispute?.choice==='B'?100:40};}
function tasks(){const s=state();$('#content').innerHTML=title('情境任务','每个任务最高100分 · 提交后按实际操作评分 · 每个情境仅计分一次',`<span class="badge">当前积分 ${totalScore(s)} / 400</span><button class="secondary" onclick="document.getElementById('assignmentFile').click()">导入教师任务单</button>`)+`<input id="assignmentFile" type="file" accept=".json" hidden onchange="importAssignments(this)">`+`<div class="grid">${taskDefs().map((t,i)=>{const p=taskProgress(t.id),r=s.taskResults[t.id],n=p.checks.filter(Boolean).length;return `<section class="card task"><div class="row between"><span class="tasknum">SCENARIO 0${i+1}</span><span class="badge ${r?'':'warn'}">${r?r.score+'分 · 已结算':n+'/'+p.checks.length+'步骤'}</span></div><h2 style="margin:15px 0 8px">${t.title}</h2><p class="muted">${t.sub}</p><ol class="steps">${t.steps.map((x,k)=>`<li class="${p.checks[k]?'done':''}">${p.checks[k]?'✓ ':''}${x}</li>`).join('')}</ol><div class="bar" style="margin:20px 0"><span style="width:${n/p.checks.length*100}%"></span></div><div class="row">${t.pages.map(p=>`<button class="secondary" onclick="go('${p}')">前往${NAV.find(n=>n[0]===p)[2]}</button>`).join('')}<button onclick="submitTask('${t.id}')">${r?'查看评分':'提交评分'}</button></div></section>`;}).join('')}</div><section class="card" style="margin-top:20px"><h3>评分规则公开</h3><p>招聘：完成流程40分，每录用一名技能≥75且经验≥1年的候选人加20分（最高100）；排班：完成全部要求100分；绩效：记录完整70分，加30分证据匹配度；员工关系：合规方案100分，其余方案40分。</p><p class="muted smalltext">任务1与3按首次提交时质量结算，任务4的首次决策锁定。成绩用于课堂讨论；纯前端成绩文件可被修改，不适合正式考试防作弊。</p></section>`;}
function submitTask(id){const s=state(),t=taskDefs().find(t=>t.id===id),p=taskProgress(id);if(s.taskResults[id])return showScore(t,s.taskResults[id]);if(!p.checks.every(Boolean))return modal('任务尚未完成',`<p>请先完成以下步骤：</p><ul>${t.steps.filter((x,i)=>!p.checks[i]).map(x=>`<li>${x}</li>`).join('')}</ul>`);if(!confirm('提交“'+t.title+'”并结算首次成绩？请确认操作质量。'))return;const r={score:p.score,date:new Date().toISOString()};s.taskResults[id]=r;log('任务评分',t.title+' / '+r.score+'分');tasks();showScore(t,r);}
function showScore(t,r){modal('任务评分 · '+t.title,`<div class="score">${r.score}<small style="font-size:18px"> / 100分</small></div><p>${r.score>=90?'业务处理完成，决策质量较高。':'业务流程已完成，建议结合反馈复盘决策质量。'}</p><div class="notice">知识点：${t.knowledge}</div><p class="muted smalltext">成绩已记录，教师可通过当前浏览器或导入报告查看。</p>`);}
function download(name,body,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function exportReport(){log('导出学习报告','导出成绩与完整操作记录');const s=state();download('澜庭酒店_学习报告_'+session.id+'.json',JSON.stringify({format:'lanting-report-v1',id:session.id,name:session.name,exportedAt:new Date().toISOString(),results:s.taskResults,logs:db.logs.filter(l=>l.student===session.id),summary:{employees:s.employees.filter(e=>e.status!=='离职').length,service:90+s.effects.service}},null,2));toast('学习报告已导出，请交给教师导入');}
function ranking(){const rows=new Map();Object.values(db.students).forEach(st=>rows.set(st.id,{id:st.id,name:st.name,results:st.state.taskResults,logs:db.logs.filter(l=>l.student===st.id),source:'本浏览器',time:''}));Object.values(db.reports).forEach(r=>{if(!rows.has(r.id))rows.set(r.id,{...r,source:'导入报告'});else{const old=rows.get(r.id);const newest=Math.max(0,...Object.values(old.results).map(x=>Date.parse(x.date)||0));if(Date.parse(r.exportedAt)>newest)rows.set(r.id,{...r,source:'导入报告（较新）'});}});return [...rows.values()].map(r=>({...r,score:Object.values(r.results).reduce((a,x)=>a+x.score,0)})).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));}
function teacher(){if(!session.teacher)return;const rows=ranking(),logs=rows.flatMap(r=>r.logs).sort((a,b)=>b.time.localeCompare(a.time));$('#content').innerHTML=title('教师端','查看实训过程，组织课堂任务与积分讨论','<button onclick="assignTask()">＋ 下发课堂任务</button><button class="secondary" onclick="document.getElementById(\'reportfile\').click()">导入学生报告</button><button class="secondary" onclick="exportClass()">导出班级成绩</button>')+`<input id="reportfile" type="file" accept=".json,application/json" multiple hidden><div class="notice">本地课堂模式：本浏览器登录的学生直接显示；其他设备由学生导出JSON学习报告，教师批量导入。任务通知仅本浏览器共享，跨设备可导出任务单供学生自行导入。演示密码不提供真实安全隔离。</div><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="label">已汇总学生</div><div class="metric">${rows.length}</div></div><div class="card"><div class="label">班级平均积分</div><div class="metric">${rows.length?(rows.reduce((a,r)=>a+r.score,0)/rows.length).toFixed(1):'0'}</div></div><div class="card"><div class="label">操作记录数</div><div class="metric">${logs.length}</div></div></div><section class="card" style="margin-top:20px"><h3>班级积分排行榜</h3><div class="tablewrap"><table><thead><tr><th>名次</th><th>姓名 / 学号</th><th>招聘</th><th>排班</th><th>绩效</th><th>员工关系</th><th>积分</th><th>来源</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i<3?'🏅 ':''}${i+1}</td><td>${esc(r.name)} / ${esc(r.id)}</td>${['task1','task2','task3','task4'].map(k=>`<td>${r.results[k]?.score??'—'}</td>`).join('')}<td><b>${r.score}</b></td><td>${r.source}</td><td><button class="small secondary" onclick="viewStudent('${esc(r.id)}')">操作明细</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">尚无学生记录，请学生登录实训或导入报告</td></tr>'}</tbody></table></div></section><section class="card"><div class="row between"><h3>课堂任务通知</h3><button class="small secondary" onclick="download('澜庭酒店_课堂任务单.json',JSON.stringify({format:'lanting-assignment-v1',assignments:db.assignments}))">导出任务单</button></div>${db.assignments.map(a=>`<div class="notice">${esc(a.title)}<br><span class="muted smalltext">${esc(a.date)}</span></div>`).join('')}</section><section class="card"><h3>全班操作日志 · 最近200条 / 共${logs.length}条</h3>${logTable(logs.slice(0,200))}</section>`;$('#reportfile').onchange=importReports;}
function logTable(logs){return `<div class="tablewrap"><table><thead><tr><th>时间</th><th>学生</th><th>操作</th><th>详情</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(new Date(l.time).toLocaleString('zh-CN'))}</td><td>${esc(l.name)} / ${esc(l.student)}</td><td>${esc(l.action)}</td><td class="log">${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">暂无操作记录</td></tr>'}</tbody></table></div>`;}
function viewStudent(id){const r=ranking().find(r=>r.id===id);modal('操作明细 · '+r.name,`<p>总分 ${r.score}，共 ${r.logs.length} 条日志（可滚动查看全部）</p>`+logTable([...r.logs].reverse()));}
function assignTask(){modal('下发课堂任务','<label class="field">任务要求<textarea name="title" required minlength="5" maxlength="1000" placeholder="例如：20分钟内完成前厅招聘与排班冲突处理"></textarea></label>',v=>{db.assignments.push({id:uid(),title:v.title,date:TODAY});save();teacher();toast('任务已下发到本浏览器所有学生账号');});}
// 导入只接受白名单字段，验证分数范围和日志结构；外部文字始终转义后渲染。
async function importReports(e){let ok=0,errors=[];for(const file of [...e.target.files]){try{if(file.size>8*1024*1024)throw Error('文件超过8MB');const r=JSON.parse(await file.text());if(r.format!=='lanting-report-v1'||typeof r.id!=='string'||! /^[A-Za-z0-9_-]{1,40}$/.test(r.id)||['__proto__','constructor','prototype'].includes(r.id)||typeof r.name!=='string'||r.name.length>30||!Number.isFinite(Date.parse(r.exportedAt))||!r.results||typeof r.results!=='object'||!Array.isArray(r.logs)||r.logs.length>30000)throw Error('报告格式无效');const results={};for(const [k,v] of Object.entries(r.results)){if(!['task1','task2','task3','task4'].includes(k)||!Number.isFinite(v.score)||v.score<0||v.score>100||!Number.isFinite(Date.parse(v.date)))throw Error('成绩字段无效');results[k]={score:v.score,date:v.date};}const logs=r.logs.map(l=>{if(typeof l.action!=='string'||typeof l.detail!=='string'||l.detail.length>10000||!Number.isFinite(Date.parse(l.time)))throw Error('日志字段无效');return{id:String(l.id||''),student:r.id,name:r.name,action:l.action.slice(0,100),detail:l.detail,time:l.time};});const prev=db.reports[r.id];if(prev&&Date.parse(prev.exportedAt)>=Date.parse(r.exportedAt))throw Error('已有相同或较新的报告');db.reports[r.id]={id:r.id,name:r.name,results,logs,exportedAt:r.exportedAt};ok++;}catch(err){errors.push(file.name+'：'+err.message);}}save();teacher();modal('报告导入结果',`<p>成功导入 ${ok} 份报告。</p>${errors.map(x=>`<p class="muted">${esc(x)}</p>`).join('')}<p class="smalltext muted">报告是教学交换文件，无法验证是否被编辑；同学号不会重复累计积分。</p>`);}
function exportClass(){const rows=[['名次','学号','姓名','招聘','排班','绩效','员工关系','总分'],...ranking().map((r,i)=>[i+1,r.id,r.name,...['task1','task2','task3','task4'].map(k=>r.results[k]?.score??''),r.score])];download('澜庭酒店_班级成绩.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'")+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');}
async function importAssignments(input){
 try{const file=input.files[0];if(!file)return;if(file.size>100000)throw Error('文件过大');const r=JSON.parse(await file.text());
 if(r.format!=='lanting-assignment-v1'||!Array.isArray(r.assignments)||r.assignments.length>100)throw Error('任务单格式无效');
 const assignments=r.assignments.map(a=>{if(typeof a.id!=='string'||typeof a.title!=='string'||a.title.length>1000||typeof a.date!=='string')throw Error('任务字段无效');return{id:a.id,title:a.title,date:a.date};});
 for(const a of assignments)if(!db.assignments.some(x=>x.id===a.id))db.assignments.push(a);log('导入教师任务单',assignments.length+'条通知');toast('教师任务已导入，请在数据看板查看');tasks();
 }catch(err){toast('导入失败：'+err.message);}
}
init();
</script></body></html>
