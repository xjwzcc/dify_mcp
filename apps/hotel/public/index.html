<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>苏州旅游职业学院 · 吴山苑酒店 · 人力资源教学仿真</title>

n:left;font-size:13px}th{background:#f4f7f8;font-weight:500;color:#647b86}th,td{padding:12px 10px;border-bottom:1px solid var(--line)}td .row{gap:5px}aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--nav);color:#c2d0d5;padding:26px 16px;overflow:auto}.brand{padding:0 12px 22px;color:white;font-size:21px;font-weight:bold;letter-spacing:2px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--gold)}nav button{display:block;background:transparent;color:#b9cbd1;width:100%;text-align:left;margin:5px 0;padding:11px 16px}nav button.active{background:#28514f;color:white;border-left:3px solid var(--gold)}.navfoot{margin:24px 12px;font-size:11px;color:#90a8b2}header{position:sticky;top:0;z-index:3;background:#fffffff2;border-bottom:1px solid var(--line);margin-left:220px;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;gap:12px}main{margin-left:220px;padding:28px 30px;max-width:1800px}.titleline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.titleline p{margin:4px 0 0}.bar{height:8px;border-radius:8px;background:#e9eff1;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.chartrow{display:grid;grid-template-columns:70px 1fr 60px;align-items:center;gap:10px;margin:17px 0}.chartrow .bar{height:20px;border-radius:4px}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:white}.loginhero{background:radial-gradient(ellipse at 10% 80%,#356e64,transparent),linear-gradient(135deg,#152e39,#173b45);color:white;padding:12vh 8vw;display:flex;flex-direction:column;justify-content:center}.loginhero h1{font-size:42px;line-height:1.4}.loginhero p{color:#bbd0d3}.loginbox{padding:10vh 7vw;display:flex;justify-content:center;flex-direction:column}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.full{grid-column:1/-1}.tabs{display:flex;gap:8px;margin:10px 0 20px}.tabs button{flex:1}dialog{border:0;border-radius:14px;padding:0;width:650px;max-width:94vw;max-height:90vh;box-shadow:0 20px 100px #0004}dialog::backdrop{background:#112b3977}dialog .dialogbody{padding:25px;overflow:auto;max-height:90vh}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dialoghead h2{margin:0}#toast{position:fixed;right:26px;bottom:24px;z-index:20;background:#153e38;color:white;border-radius:9px;box-shadow:0 8px 30px #0003;padding:14px 22px;max-width:80vw;display:none}.task{position:relative}.tasknum{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:bold}.steps{padding-left:20px}.steps li{margin:7px 0}.done{color:var(--accent)}.score{font-size:36px;color:var(--accent);font-weight:bold}.shift{padding:6px;width:76px}.shift[data-s="夜班"]{background:#eae8fb}.shift[data-s="休"]{background:#f1f3f4}.shift[data-s="早班"]{background:#e7f3eb}.shift[data-s="中班"]{background:#fff2dc}.log{white-space:normal;min-width:260px}.empty{padding:30px;text-align:center;color:var(--muted)}.split{display:flex;gap:8px}.kpirow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:10px 0}.mobile{display:none}footer{font-size:12px;color:var(--muted);padding:20px 0}a{color:var(--accent)}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:760px){aside{width:170px;padding:20px 8px;display:none}body.menu aside{display:block;z-index:8;top:65px}header,main{margin-left:0;padding:16px}.mobile{display:inline-block}.cards{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.loginhero{padding:40px 28px}.loginhero h1{font-size:29px}.loginbox{padding:30px}.formgrid{grid-template-columns:1fr}.titleline{align-items:flex-start}header{font-size:12px}.brand{font-size:18px}.metric{font-size:25px}}
