<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电子菜单点餐仿真 · 苏州旅游职业学院</title>
<style>
  :root{
    --red:#E9432F; --red-d:#C73522; --dark:#1F2733; --gray:#66707D;
    --bg:#F5F6F8; --card:#FFFFFF; --line:#E3E6EA; --blue:#2A6EC9; --green:#1F9D55; --amber:#D98A15;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--dark); font-size:14px; -webkit-text-size-adjust:100%;}
  header{position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line); padding:10px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .brandwrap{display:flex; flex-direction:column;}
  .schoolbar{font-size:12px; font-weight:700; color:var(--blue); letter-spacing:1px; margin-bottom:1px;}
  .brand{font-size:17px; font-weight:700;}
  .brand small{color:var(--gray); font-weight:400; margin-left:8px; font-size:12px;}
  nav{display:flex; gap:8px; margin-left:auto;}
  .tab{border:1px solid var(--line); background:#fff; padding:7px 16px; border-radius:20px; cursor:pointer; font-size:14px;}
  .tab.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  /* ===== 账号区（页首） ===== */
  .who{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--gray);}
  .who b{color:var(--dark); font-size:13px;}
  .minilink{border:1px solid var(--line); background:#fff; border-radius:14px; padding:5px 12px; font-size:12.5px; cursor:pointer;}
  /* ===== 营业 / 闭店 总闸 ===== */
  .openbtn{border:1px solid #BFE3CB; background:#E8F6EC; color:#1E7A3C; border-radius:16px; padding:5px 13px;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .openbtn.off{background:#FDECEC; color:#B3261E; border-color:#F3C4C0;}
  .openbtn:hover{filter:brightness(.95);}
  .openbtn small{display:block; font-weight:400; font-size:10.5px; opacity:.75; margin-top:1px;}
  @media (max-width:640px){
    .openbtn small{display:none;}
    .openbtn{padding:5px 10px; font-size:12px;}
    header{gap:8px;}
  }
  .bannerclosed{background:#FDECEC; border:1px solid #F3C4C0; color:#B3261E; font-size:12.5px; line-height:1.7;
    padding:8px 14px; border-radius:8px; margin-bottom:12px;}
  .bannerclosed b{color:#8E1B14;}
  .closedwrap{position:fixed; inset:0; z-index:400; background:linear-gradient(#1F2733,#2A3542);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto;}
  .closedbox{background:#fff; border-radius:16px; width:min(420px,100%); padding:30px 26px 22px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .closedbox .cico{font-size:44px; line-height:1;}
  .closedbox h3{font-size:19px; margin:12px 0 8px; color:#1F2733;}
  .closedbox .cr{font-size:13.5px; color:#66707D; line-height:1.85;}
  .closedbox .cnote{margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); font-size:11.5px; color:#9AA3AD; line-height:1.7;}
  .closedbox .cbtn{margin-top:16px; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:10px 18px; font-size:13.5px; cursor:pointer; font-family:inherit; width:100%;}
  .closedbox .cbtn:hover{background:#F7F8FA;}
  /* ===== 整站访问闸门 ===== */
  .gatepin{display:flex; gap:8px; margin-top:16px;}
  .gatepin input{flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; text-align:center; letter-spacing:2px;}
  .gatepin .cbtn{width:auto; margin-top:0; padding:10px 20px; background:var(--dark); color:#fff;
    border-color:var(--dark); flex:none;}
  .gatepin .cbtn:hover{background:#2A3542;}
  .gaterr{color:var(--red); font-size:12px; min-height:16px; margin-top:6px;}
  .datanote{color:#9AA3AD; font-size:12px; line-height:1.7; margin-top:10px; text-align:right;}
  #toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(12px); background:var(--dark); color:#fff; padding:9px 20px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:700; max-width:90%; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .hint{background:#FFF7E8; color:#8A6116; font-size:12.5px; padding:6px 18px; border-bottom:1px solid #F0E3C8;}
  main{max-width:1080px; margin:0 auto; padding:16px;}

  /* ===== 登录 / 账号 ===== */
  .loginwrap{position:fixed; inset:0; z-index:300; background:linear-gradient(#1F2733,#2A3542); display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto;}
  .loginbox{background:#fff; border-radius:16px; width:min(400px,100%); padding:26px 24px 20px; box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .lgeye{font-size:12.5px; font-weight:700; color:var(--blue); letter-spacing:1px; margin-bottom:5px;}
  .loginbox h2{font-size:19px; margin-bottom:18px;}
  .loginbox .sub{color:var(--gray); font-size:12.5px; margin-bottom:18px; line-height:1.6;}
  .lgfld{margin-bottom:12px;}
  .lgfld label{display:block; font-size:12.5px; font-weight:700; color:var(--gray); margin-bottom:5px;}
  .lgfld input{width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit;}
  .lgtip{color:#9AA3AD; font-size:11.5px; margin-top:5px; line-height:1.6;}
  .lgerr{color:var(--red); font-size:12.5px; min-height:18px; margin:2px 0 8px;}
  .lgbtn{width:100%; background:var(--red); color:#fff; border:none; border-radius:10px; padding:13px; font-size:16px; font-weight:700; cursor:pointer;}
  .lgbtn.ghost{background:#fff; color:var(--dark); border:1px solid var(--line); margin-top:9px; font-weight:400; font-size:14px; padding:11px;}
  .lgfoot{margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; font-size:12.5px;}
  .lgfoot a{color:var(--blue); cursor:pointer;}
  /* ===== 顾客端 ===== */
  .tablebar{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px; flex-wrap:wrap;}
  .tablebar b{font-size:14px;}
  .tchip{border:1px solid var(--line); border-radius:16px; padding:4px 13px; cursor:pointer; background:#fff;}
  .tchip.sel{background:var(--red); color:#fff; border-color:var(--red);}
  .foodgrid{display:flex; gap:14px; align-items:flex-start;}
  .cats{display:flex; flex-direction:column; gap:6px; min-width:76px; position:sticky; top:72px;}
  .cat{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; text-align:center; font-size:13.5px;}
  .cat.sel{background:var(--dark); color:#fff; border-color:var(--dark);}
  .dishes{flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px;}
  .dish{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; gap:12px; position:relative;}
  .dish .pic{width:52px; height:52px; border-radius:8px; background:#FDEDEA; display:flex; align-items:center; justify-content:center; font-size:26px; flex:none;}
  .dish h4{font-size:15px; margin-bottom:3px;}
  .dish .desc{color:var(--gray); font-size:12px; margin-bottom:5px;}
  .dish .price{color:var(--red); font-weight:700; font-size:15px;}
  .dish .price small{font-weight:400; color:var(--gray); font-size:11px;}
  .addbtn{position:absolute; right:12px; bottom:10px; width:28px; height:28px; border-radius:14px; background:var(--red); color:#fff; border:none; font-size:18px; cursor:pointer; line-height:1;}
  .dish.off .pic,.dish.off h4,.dish.off .desc,.dish.off .price{opacity:.35;}
  .soldout{position:absolute; right:12px; top:10px; color:var(--gray); font-size:12px; border:1px solid var(--line); border-radius:4px; padding:2px 6px;}
  .cartbar{position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:min(680px,92%); background:var(--dark); border-radius:26px; color:#fff; display:flex; align-items:center; gap:14px; padding:10px 20px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.25); cursor:pointer;}
  .cartbar .cnt{background:var(--red); border-radius:12px; padding:2px 10px; font-size:13px;}
  .cartbar .total{font-size:17px; font-weight:700; color:#FFD9A0;}
  .cartbar .go{margin-left:auto; background:var(--red); border-radius:18px; padding:7px 18px; font-size:14px;}
  .cartpanel{position:fixed; left:50%; transform:translateX(-50%); bottom:76px; width:min(680px,92%); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; z-index:59; box-shadow:0 6px 20px rgba(0,0,0,.15); display:none;}
  .cartpanel.show{display:block;}
  .citem{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
  .citem .nm{flex:1;}
  .citem .nm small{display:block; color:var(--gray); font-size:11.5px;}
  .qty{display:flex; align-items:center; gap:8px;}
  .qty button{width:22px; height:22px; border-radius:11px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; line-height:1;}
  .notearea{width:100%; margin-top:8px; border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;}
  .submit{width:100%; margin-top:10px; background:var(--red); color:#fff; border:none; border-radius:10px; padding:11px; font-size:15px; font-weight:700; cursor:pointer;}
  .submit:disabled{background:#C7CCD2; cursor:not-allowed;}

  .myorders{margin-top:16px;}
  .myorders h3{font-size:14.5px; margin-bottom:8px; color:var(--dark);}
  .oitem{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
  .oitem .head{display:flex; gap:10px; align-items:center; margin-bottom:4px; flex-wrap:wrap;}
  .oitem .head b{font-size:14px;}
  .badge{font-size:11.5px; border-radius:10px; padding:2px 9px;}
  .b-new{background:#EAF1FC; color:var(--blue);}
  .b-cook{background:#FFF3E0; color:var(--amber);}
  .b-done{background:#E7F6EE; color:var(--green);}
  .b-paid{background:#EEEEF0; color:var(--gray);}
  .oitem .body{color:var(--gray); font-size:12.5px; line-height:1.7;}

  /* 弹层 */
  .mask{position:fixed; inset:0; background:rgba(20,24,30,.45); z-index:400; display:none; align-items:center; justify-content:center; padding:16px;}
  .mask.show{display:flex;}
  .dlg{background:#fff; border-radius:14px; width:min(420px,94%); padding:18px 20px; max-height:86vh; overflow:auto;}
  .dlg h3{font-size:16px; margin-bottom:4px;}
  .dlg .sub{color:var(--gray); font-size:12.5px; margin-bottom:12px;}
  .optgrp{margin-bottom:12px;}
  .optgrp label{display:block; font-size:13px; font-weight:700; margin-bottom:6px;}
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{border:1px solid var(--line); border-radius:16px; padding:5px 13px; cursor:pointer; font-size:13px; background:#fff;}
  .opt.sel{background:var(--dark); color:#fff; border-color:var(--dark);}
  .opt.sel.pricey{background:var(--red); border-color:var(--red);}
  .dlgbtns{display:flex; gap:10px; margin-top:6px;}
  .dlgbtns button{flex:1; border-radius:10px; padding:10px; font-size:14.5px; cursor:pointer; border:none; font-weight:700;}
  .canc{background:#EEEEF0; color:var(--dark);}
  .okb{background:var(--red); color:#fff;}
  /* 自绘对话框（替代 alert / confirm / prompt，兼容手机与微信内置浏览器） */
  .uimask{z-index:600;}
  .uimsg{font-size:13.5px; color:var(--gray); line-height:1.75; white-space:pre-line; margin:6px 0 10px;}
  .uifld{display:flex; gap:8px; align-items:stretch; margin-bottom:4px;}
  .uifld input{flex:1; min-width:0; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--dark); font-family:inherit;}
  .uifld input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(42,110,201,.12);}
  .uieye{flex:none; border:1px solid var(--line); background:#F5F6F8; color:var(--gray); border-radius:10px; padding:0 13px; font-size:13px; cursor:pointer; font-family:inherit;}
  .uierr{color:var(--red-d); font-size:12.5px; min-height:18px; line-height:18px; margin-bottom:2px;}
  .uimask .okb{background:var(--blue);}
  .uimask .okb.danger{background:var(--red);}
  /* ===== 商家端 ===== */
  .subtabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .subtab{border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13.5px;}
  .subtab.sel{background:var(--blue); color:#fff; border-color:var(--blue);}
  .kds{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .kcol{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; min-height:260px;}
  .kcol h4{font-size:13.5px; padding:4px 6px 10px; display:flex; justify-content:space-between;}
  .kcol h4 span{color:var(--gray); font-weight:400;}
  .kcard{border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px; background:#fff;}
  .kcard.paidcard{background:#F4FAF5; border-color:#BFE3CB;}
  .kcard .kh{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .kcard .kh b{font-size:14.5px;}
  .kcard .tm{color:var(--gray); font-size:11.5px;}
  .kcard .li{font-size:12.8px; line-height:1.75; color:var(--dark);}
  .kcard .li small{color:var(--red);}
  .kcard .note{color:var(--amber); font-size:12px; margin-top:3px;}
  .kbtn{width:100%; margin-top:8px; border:none; border-radius:8px; padding:7px; font-size:13px; cursor:pointer; font-weight:700;}
  .kb1{background:#EAF1FC; color:var(--blue);}
  .kb2{background:#FFF3E0; color:var(--amber);}
  .kb3{background:#E7F6EE; color:var(--green);}
  /* ===== 模拟收银台（结账支付） ===== */
  .paygrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 4px;}
  .paym{border:2px solid var(--line); background:#fff; border-radius:12px; padding:15px 10px; font-size:15px; font-weight:700;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; font-family:inherit; color:var(--dark);}
  .paym .pe{font-size:26px; line-height:1;}
  .paym small{font-weight:400; color:var(--gray); font-size:11.5px;}
  .paym:hover{border-color:var(--blue); background:#F5F9FF;}
  .paym:active{transform:scale(.97);}
  .paym.wx{border-color:#B7E5B0;} .paym.zfb{border-color:#BBD8F7;} .paym.credit,.paym.debit{border-color:#E3D6C8;}
  .paym.meituan{border-color:#F5D96B;} .paym.dianping{border-color:#F5C6A0;}
  .payamt{text-align:center; margin:12px 0 2px;}
  .payamt .big{font-size:34px; font-weight:800; color:var(--red);}
  .payinfo{display:flex; justify-content:space-between; font-size:13px; color:var(--gray); padding:5px 4px; border-bottom:1px dashed var(--line);}
  .payproc,.payok{text-align:center; padding:22px 0 14px;}
  .spin{width:36px; height:36px; border:4px solid var(--line); border-top-color:var(--blue); border-radius:50%;
    margin:0 auto 12px; animation:paysp .8s linear infinite;}
  @keyframes paysp{to{transform:rotate(360deg);}}
  .payok .big{font-size:44px; line-height:1;}
  .payok h3{margin:10px 0 4px;}
  .payhint{background:#FFF7E8; border:1px solid #F3DFAF; color:#8A6A12; border-radius:10px;
    padding:11px 14px; font-size:13.5px; margin-bottom:12px; cursor:pointer; line-height:1.6;}
  .paygo{display:block; width:100%; margin-top:9px; border:none; background:#1AAD19; color:#fff;
    border-radius:8px; padding:11px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  .paygo:active{filter:brightness(.93);}
  .setrow{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13.5px; border-bottom:1px dashed var(--line);}
  .setrow span{flex:1; color:var(--gray);}
  .setrow .tin{width:90px; text-align:center;}
  /* 菜单体检 */
  .cktitle{font-size:15px; margin:16px 0 8px; padding-left:9px; border-left:4px solid var(--red);}
  .ckrow{display:flex; gap:9px; align-items:flex-start; padding:8px 2px; border-bottom:1px dashed var(--line);}
  .ckic{flex:none; font-size:15px;}
  .cktx{font-size:13.5px; line-height:1.6;}
  .ckad{color:var(--gray); font-size:12px; margin-top:2px;}
  .ckquad{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px;}
  .ckqh{font-size:13.5px; font-weight:700; display:flex; justify-content:space-between; margin-bottom:7px;}
  .ckqh span{color:var(--gray); font-weight:400;}
  .ckchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .chip{border:1px solid var(--line); background:#F7F8FA; border-radius:12px; padding:3px 10px; font-size:12px;}
  .chip.none{color:#9AA3AD;}
  .ckscore{margin-top:14px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px;}
  .ckscore b{font-size:26px; color:var(--red); margin:0 4px;}
  .kb4{background:#EEEEF0; color:var(--gray);}

  table.mgmt{width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden;}
  table.mgmt th,table.mgmt td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; font-size:13.5px;}
  table.mgmt th{background:#F2F4F6; font-size:12.5px; color:var(--gray);}
  .priceinput{width:76px; border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:13.5px;}
  .tin{border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px; font-family:inherit;}
  .soBtn{border:none; border-radius:14px; padding:4px 13px; font-size:12.5px; cursor:pointer;}
  .soOn{background:#FDECEA; color:var(--red);}
  .soOff{background:#E7F6EE; color:var(--green);}

  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .stat .v{font-size:24px; font-weight:800; color:var(--dark); margin-top:4px;}
  .stat .v small{font-size:13px; font-weight:400; color:var(--gray);}
  .stat.redv .v{color:var(--red);}
  .tops{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .tops h4{font-size:14px; margin-bottom:10px;}
  .trow{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13.5px;}
  .trow .rank{width:20px; height:20px; border-radius:10px; background:#EEEEF0; text-align:center; line-height:20px; font-size:12px; flex:none;}
  .trow:nth-child(2) .rank{background:#FFE9C8;} .trow:nth-child(3) .rank{background:#FDECEA;} 
  .trow .bar{height:8px; border-radius:4px; background:var(--red); opacity:.75;}
  .trow .qty2{margin-left:auto; color:var(--gray);}
  .flow{margin-top:14px;}
  .flow table{width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden;}
  .flow th,.flow td{padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; text-align:left;}
  .flow th{background:#F2F4F6; color:var(--gray); font-size:12px;}
  .resetrow{margin-top:16px; text-align:right;}
  .reset{background:#fff; border:1px solid var(--line); color:var(--gray); border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13px;}
  .reset:hover{color:var(--red); border-color:var(--red);}
  .empty{color:#9AA3AD; text-align:center; padding:30px 0; font-size:13px;}
  footer{color:#9AA3AD; text-align:center; font-size:12px; padding:22px 0 90px;}
  .qrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
  .qrcard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center;}
  .qrcard b{display:block; font-size:16px; margin-bottom:2px;}
  .qrcard .tno{color:var(--gray); font-size:12px; margin-bottom:10px; word-break:break-all;}
  .qrcard canvas{display:block; margin:0 auto;}
  .qrnote{background:#EEF4FB; color:#1F4E79; font-size:12px; line-height:1.7; padding:8px 12px; border-radius:8px; margin-bottom:12px;}

    var p = d.specPrice && c.spec && d.specPrice[c.spec]!=null ? d.specPrice[c.spec] : d.price;
    t += p*c.qty;
  });
  return t;
}
function cartCount(){
  var n=0; cart.forEach(function(c){ n+=c.qty; }); return n;
}
function nowHM(){
  var d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function minsAgo(ts){
  return Math.max(0, Math.round((Date.now()-ts)/60000));
}

function pickTable(t){ curTable=t; render(); }

function chGuests(d){

function chQty(i,delta){

/* 加菜弹层 */
var dlgDish = null, dlgSpec = null, dlgMods = [], dlgQty = 1, dlgNote='';
function openItem(id){
  var d = dishById(id); if(!d||d.soldOut) return;
  dlgDish=d; dlgSpec = d.specs? d.specs[0].n : null; dlgMods=[]; dlgQty=1; dlgNote='';
  renderDlg();
}
function renderDlg(){
  var m=document.getElementById('dlgMask'); if(!m){
    m=document.createElement('div'); m.className='mask'; m.id='dlgMask';
    m.innerHTML='<div class="dlg" id="dlgBody"></div>';
    m.onclick=function(ev){ if(ev.target===m) closeDlg(); };
    document.body.appendChild(m);
  }
  m.className='mask show';

  var price = d.specPrice && dlgSpec && d.specPrice[dlgSpec]!=null ? d.specPrice[dlgSpec] : d.price;
  var h=(d.img?'<img class="dishBig" src="'+d.img+'" alt="">':'')
    +'<h3>'+d.emoji+' '+esc(d.name)+'</h3>'+(d.desc? '<div class="sub">'+esc(d.desc)+'</div>':'<div class="sub"></div>');
  if(d.specs){
    h+='<div class="optgrp"><label>规格</label><div class="opts">';
    d.specs.forEach(function(s){
      var p = d.specPrice && d.specPrice[s.n]!=null ? d.specPrice[s.n] : d.price+s.add;
      h+='<span class="opt'+(dlgSpec===s.n?' sel pricey':'')+'" onclick="setSpec(\''+esc(s.n)+'\')">'+esc(s.n)+' ¥'+p+'</span>';
    });
    h+='</div></div>';
  }
  h+='<div class="optgrp"><label>口味做法 / 个性化（可多选）</label><div class="opts">';
  MODS.forEach(function(mo){
    h+='<span class="opt'+(dlgMods.indexOf(mo)>=0?' sel':'')+'" onclick="toggMod(\''+mo+'\')">'+mo+'</span>';
  });
  h+='</div></div>';
  h+='<div class="optgrp"><label>数量</label><div class="qty" style="gap:12px;">'
    +'<button style="width:26px;height:26px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;" onclick="dlgQty=Math.max(1,dlgQty-1);renderDlg()">−</button>'
    +'<b style="font-size:16px;">'+dlgQty+'</b>'
    +'<button style="width:26px;height:26px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;" onclick="dlgQty++;renderDlg()">＋</button>'
    +'</div></div>';
  h+='<div class="optgrp"><label>本菜备注</label><input class="notearea" id="dlgNote" style="margin-top:0;" placeholder="如：上菜时说明做法" value="'+esc(dlgNote)+'"></div>';
  h+='<div class="dlgbtns"><button class="canc" onclick="closeDlg()">取消</button>'
    +'<button class="okb" onclick="addToCart()">加入购物车 ¥'+(price*dlgQty)+'</button></div>';
  document.getElementById('dlgBody').innerHTML=h;
}
function setSpec(s){
  var n=document.getElementById('dlgNote'); if(n) dlgNote=n.value;
  dlgSpec=s; renderDlg();
}
function toggMod(mo){
  var n=document.getElementById('dlgNote'); if(n) dlgNote=n.value;
  var i=dlgMods.indexOf(mo);
  if(i>=0) dlgMods.splice(i,1); else dlgMods.push(mo);
  renderDlg();
}
function closeDlg(){ document.getElementById('dlgMask').className='mask'; }
function addToCart(){
  var n=document.getElementById('dlgNote'); if(n) dlgNote=n.value;
  var key = dlgDish.id+'|'+dlgSpec+'|'+dlgMods.join(',')+'|'+dlgNote;
  var found=false;
  cart.forEach(function(c){
    if(c.dishId+'|'+c.spec+'|'+(c.mods||[]).join(',')+'|'+(c.note||'')===key){ c.qty+=dlgQty; found=true; }
  });
  if(!found){
    cart.push({dishId:dlgDish.id, spec:dlgSpec, mods:dlgMods.slice(), note:dlgNote, qty:dlgQty});
  }
  closeDlg(); render();
}
function submitOrder(){
  if(!cart.length) return;
  var noteEl=document.getElementById('orderNote');
  if(noteEl) cartNote=noteEl.value;
  S.seq++;
  var no = curTable+'-'+String(S.seq).slice(-3);
  var items = cart.map(function(c){
    var d=dishById(c.dishId);
    var price = d.specPrice && c.spec && d.specPrice[c.spec]!=null ? d.specPrice[c.spec] : d.price;
    return {name:(d.name+(c.spec?'（'+c.spec+'）':'')), price:price, qty:c.qty, mods:c.mods.slice(), dishId:c.dishId};
  });
  S.orders.push({no:no, table:curTable, items:items, orderNote:cartNote, guests:cartGuests, status:'new', ts:Date.now(), timeHM:nowHM()});
  cart=[]; cartNote=''; cartGuests=2; cartOpen=false;
  save(); render();
  showOrderCode(no);
}

var PAY_METHODS = [
  {k:'wx',     n:'微信支付', e:'💬', d:'扫码 / 付款码'},
  {k:'zfb',    n:'支付宝',   e:'🅰️', d:'扫码 / 花呗'},

];

var payDlg = null;
function orderAmt(o){ var a=0; o.items.forEach(function(it){ a+=it.price*it.qty; }); return a; }
function openPayDlg(no){
  var o=null; S.orders.forEach(function(x){ if(x.no===no) o=x; });

function payBody(){
  var m=document.getElementById('payMask');

    m=document.createElement('div'); m.className='mask'; m.id='payMask';
    m.innerHTML='<div class="dlg" id="payBody"></div>';

function closePayDlg(){

}
function renderPayDlg(){

        +o.items.reduce(function(s,it){return s+it.qty;},0)+' 件</b></div>'

      +'<div class="paygrid">';

      h+='<button class="paym '+p.k+'" onclick="pickPay(\''+p.k+'\')"><span class="pe">'+p.e+'</span>'+p.n+'<small>'+p.d+'</small></button>';

  } else if(payDlg.step==='proc'){
    h+='<h3>正在支付…</h3>'
      +'<div class="payproc"><div class="spin"></div>'
      +'<div style="font-size:14px;">正在连接 <b>'+(PAY_NAME[payDlg.method]||'')+'</b>，请客人确认…</div>'
      +'<div style="color:var(--gray);font-size:12px;margin-top:8px;">教学模拟 · 不产生真实扣款</div></div>';

      +'<h3>支付成功</h3>'
      +'<div style="font-size:14px;"><b>'+(PAY_NAME[payDlg.method]||'')+'</b> · '+esc(o.table)+' 桌</div>'

        : ('¥'+amt.toFixed(0)))
      +'</div>'
      +'<div style="color:var(--gray);font-size:12px;margin-top:8px;">已按结算价计入营业统计，收银台即将关闭…</div></div>';
  }

function pickPay(k){
  if(!payDlg || payDlg.step!=='pick') return;
  payDlg.method=k; payDlg.step='proc'; renderPayDlg();
  var no=payDlg.no, mk=k;
  setTimeout(function(){
    S.orders.forEach(function(o){ if(o.no===no){
      o.status='paid'; o.payMethod=mk; o.payTs=Date.now();
      var a=orderAmt(o); var s=a;
      if(mk==='meituan'||mk==='dianping'){
        var f=(S.voucher && S.voucher[mk]) || 0.8;
        f=Math.min(1, Math.max(0.3, parseFloat(f)||0.8));
        s=Math.round(a*f*10)/10;
      }
      o.settle=s;
    } });
    if(!save()){ uiAlert('保存失败','本机浏览器存储空间不足，支付结果未保存。'); }
    payDlg={ no:no, step:'done', method:mk };
    renderPayDlg();
    setTimeout(function(){ if(payDlg && payDlg.no===no && payDlg.step==='done') closePayDlg(); }, 1400);
  }, 1200);
}
function payName(k){ return PAY_NAME[k] || ''; }
function saveVoucher(){
  var mt=parseFloat(val('gvMt')), dp=parseFloat(val('gvDp'));
  if(isNaN(mt)||isNaN(dp)){ uiAlert('提示','折扣必须是数字，如 0.8'); return; }
  mt=Math.min(1, Math.max(0.3, mt)); dp=Math.min(1, Math.max(0.3, dp));
  S.voucher={meituan:Math.round(mt*100)/100, dianping:Math.round(dp*100)/100};
  save(); render();
}

/* ================= 数据决策：多维分析 + 决策建议 ================= */
var insX='时段', insM='营业额';
var INS_TEXT='';
function setIns(){ insX=val('insX'); insM=val('insM'); render(); }
function orderGross(o){ var a=0; o.items.forEach(function(it){ a+=it.price*it.qty; }); return a; }
function oHour(o){ return (o.timeHM&&/^\d{2}:/.test(o.timeHM))? o.timeHM.slice(0,2)+':00' : '未知'; }

function insAggregate(){
  var rows={};
  function add(k,a,n,q){ var r=rows[k]||(rows[k]={amt:0,n:0,qty:0}); r.amt+=a; r.n+=n; r.qty+=q; }
  S.orders.forEach(function(o){
    var a=orderGross(o), q=o.items.reduce(function(s,it){return s+it.qty;},0);
    if(insX==='时段') add(oHour(o),a,1,q);
    else if(insX==='桌台') add(String(o.table||'未知'),a,1,q);
    else if(insX==='支付方式') add(o.status==='paid'? (PAY_NAME[o.payMethod]||'未记录') : '未结账', a,1,q);
    else if(insX==='分类') o.items.forEach(function(it){ var d=dishById(it.dishId); add((d&&d.cat)||'其他', it.price*it.qty, 0, it.qty); });
    else { /* 菜品TOP */ o.items.forEach(function(it){ add(it.name.split('（')[0], it.price*it.qty, 0, it.qty); }); }
  });
  var arr=Object.keys(rows).map(function(k){ return [k, rows[k].amt, rows[k].n, rows[k].qty]; });
  if(insX==='时段') arr.sort(function(a,b){ return a[0]<b[0]?-1:1; });
  else arr.sort(function(a,b){
    var v = insM==='单数'?b[2]-a[2] : insM==='销量'?b[3]-a[3] : b[1]-a[1];
    return v;
  });
  if(insX==='菜品TOP') arr=arr.slice(0,8);
  return arr;
}
function insDaily(){
  var days={};
  S.orders.forEach(function(o){
    var d=new Date(o.ts||Date.now());
    var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    var r=days[k]||(days[k]={amt:0,n:0,g:0});
    r.amt+=orderGross(o); r.n++; r.g+=(o.guests||0);
  });
  return Object.keys(days).sort().map(function(k){ return [k, days[k].amt, days[k].n, days[k].g]; });
}
function insSuggestions(){
  var out=[], orders=S.orders;
  if(!orders.length){ out.push(['📦','暂无数据','先让顾客产生几笔订单，决策建议会基于真实数据生成。','——']); return out; }
  var total=orders.reduce(function(s,o){return s+orderGross(o);},0);
  /* 1 高峰集中度 */
  var hrMp={};
  orders.forEach(function(o){ var k=oHour(o); hrMp[k]=(hrMp[k]||0)+orderGross(o); });
  var hrArr=Object.keys(hrMp).map(function(k){return [k,hrMp[k]];}).sort(function(a,b){return b[1]-a[1];});
  if(hrArr.length && total>0 && hrArr[0][1]/total>0.4){
    out.push(['⏰','高峰过于集中：'+hrArr[0][0]+' 时段占全天营业额 '+Math.round(hrArr[0][1]/total*100)+'%',
      '高峰前 30 分钟加派传菜/收银人手；低峰时段用限时优惠（如下午茶）削峰填谷。','考点：时段销售分析 → 排班与备货决策']);
  }
  /* 2 团购让利率 */
  var rev=0, gv=0;
  orders.forEach(function(o){ if(o.status==='paid'){ var a=orderGross(o); var s=(o.settle!=null)?o.settle:a; rev+=s; gv+=(a-s); } });
  if(rev>0 && gv/rev>0.1){
    out.push(['🟡','团购让利率偏高：让利 ¥'+gv.toFixed(0)+'，占结算营业额 '+Math.round(gv/rev*100)+'%',
      '评估团购的定位：是引流款（可接受）还是常态（侵蚀毛利）。可降低折扣或限制团购菜品范围。','考点：结算口径 vs 门市口径 → 毛利保护']);
  }
  /* 3 滞销占比 */
  if(S.menu.length){
    var soldById={};
    orders.forEach(function(o){ o.items.forEach(function(it){ if(it.dishId) soldById[it.dishId]=(soldById[it.dishId]||0)+it.qty; }); });
    var zero=S.menu.filter(function(d){return !soldById[d.id];}).length;
    if(zero/S.menu.length>0.25){
      out.push(['🐕','菜单滞销率偏高：'+zero+'/'+S.menu.length+' 道菜从未被点过（'+Math.round(zero/S.menu.length*100)+'%）',
        '菜单瘦身：淘汰或改良滞销菜，减少备货损耗，聚焦爆款。','考点：滞销预警 → 菜单优化与淘汰决策']);
    }
  }
  /* 4 弱势分类 */
  var catMp={};
  orders.forEach(function(o){ o.items.forEach(function(it){ var d=dishById(it.dishId); var c=(d&&d.cat)||'其他'; catMp[c]=(catMp[c]||0)+it.price*it.qty; }); });
  var catArr=Object.keys(catMp).map(function(k){return [k,catMp[k]];}).sort(function(a,b){return a[1]-b[1];});
  if(catArr.length>=3 && total>0 && catArr[0][1]/total<0.05){
    out.push(['📉','弱势分类：「'+catArr[0][0]+'」金额占比仅 '+Math.round(catArr[0][1]/total*100)+'%',
      '要么精简该分类（减少备货与损耗），要么检查定价与图片描述是否影响下单。','考点：分类销售统计 → 菜单结构调整']);
  }
  /* 5 支付集中 */
  var pmMp={};
  orders.forEach(function(o){ if(o.status==='paid'){ var k=o.payMethod||'未记录'; pmMp[k]=(pmMp[k]||0)+((o.settle!=null)?o.settle:orderGross(o)); } });
  var pmArr=Object.keys(pmMp).map(function(k){return [k,pmMp[k]];}).sort(function(a,b){return b[1]-a[1];});
  if(pmArr.length && rev>0 && pmArr[0][1]/rev>0.7){
    out.push(['💳','支付方式集中：「'+(PAY_NAME[pmArr[0][0]]||pmArr[0][0])+'」占 '+Math.round(pmArr[0][1]/rev*100)+'%',
      '单一渠道依赖便于对账但要防渠道波动；可设计差异化优惠引导多元支付。','考点：支付方式统计 → 收银管理']);
  }
  /* 6 未结账 */
  var unrev=orders.filter(function(o){return o.status!=='paid';}).reduce(function(s,o){return s+orderGross(o);},0);
  if(unrev>0){
    out.push(['🔔','在店未结账 ¥'+unrev.toFixed(0)+'（'+orders.filter(function(o){return o.status!=='paid';}).length+' 单）',
      '出餐后及时提醒结账（顾客端已有「去支付」入口），避免跑单与营业额虚低。','考点：订单状态流转 → 收银管理']);
  }
  /* 7 毛利诊断 */
  var withCost=S.menu.filter(function(d){return d.cost>0;});
  if(withCost.length>=3){
    var rows=S.menu.map(function(d){
      var q=0; orders.forEach(function(o){ o.items.forEach(function(it){ if(it.dishId===d.id) q+=it.qty; }); });
      var mr=(d.price>0)?(d.price-d.cost)/d.price:0;
      return {n:d.name,q:q,mr:mr};
    });
    var puzzles=rows.filter(function(r){return r.q>0&&r.mr<0.5;}).sort(function(a,b){return b.q-a.q;}).slice(0,3);
    if(puzzles.length){
      out.push(['❓','旺销低毛利菜品：'+puzzles.map(function(r){return r.n+'（毛利 '+Math.round(r.mr*100)+'%）';}).join('、'),
        '这三道菜卖得好但毛利偏低——优先复核定价与成本，或将其明确为引流款。','考点：菜单工程「谜题菜」 → 定价决策']);
    }
  }
  /* 8 日环比 */
  var daily=insDaily();
  if(daily.length>=2){
    var cur=daily[daily.length-1], prev=daily[daily.length-2];
    if(prev[1]>0){
      var diff=Math.round((cur[1]-prev[1])/prev[1]*100);
      out.push([diff>=0?'📈':'📉','营业额环比：'+(diff>=0?'+':'')+diff+'%（'+prev[0]+' ¥'+prev[1].toFixed(0)+' → '+cur[0]+' ¥'+cur[1].toFixed(0)+'）',
        diff>=0?'增长来自哪里？用上面的维度透视定位增长点，加码有效动作。':'下滑时先看客流还是客单价：客流降→引流，客单价降→搭售与套餐。','考点：按日趋势 → 经营复盘']);
    }
  }
  return out;
}

    L.push('一、按日趋势');

      var hb=(i>0&&daily[i-1][1]>0)?(' 环比'+(d[1]>=daily[i-1][1]?'+':'')+Math.round((d[1]-daily[i-1][1])/daily[i-1][1]*100)+'%'):'';
      L.push('  '+d[0]+'：营业额 ¥'+d[1].toFixed(0)+' · '+d[2]+' 单 · '+d[3]+' 人'+hb);

      orders.forEach(function(o){ o.items.forEach(function(it){
        var d=dishById(it.dishId);
        if(d&&d.cost>0){ totRev+=it.price*it.qty; totCost+=d.cost*it.qty; }
      }); });
      var gm=totRev?(totRev-totCost)/totRev:0;
      item(gm>=0.55, 30, '综合毛利率：'+Math.round(gm*100)+'%（已填成本菜品口径）', '餐饮综合毛利一般在 55%–65%；偏低时优先检查高销量菜的定价与成本');
    }
  }
  h+='<div class="ckscore">菜单体检得分：<b>'+Math.round(score/Math.max(1,full)*100)+'</b> / 100'
    +(orders.length<5?'（结构层）':'（结构 + 经营）')+'</div>'
    +'<div class="datanote">体检依据：菜单工程（Kasavana & Smith 四象限）+ 菜单结构设计常规指标；象限以中位数分界。</div>';
  return h;
}

function readImgFile(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    var im=new Image();
    im.onload=function(){
      var max=260, w=im.width, h=im.height, sc=Math.min(1, max/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*sc)); cv.height=Math.max(1,Math.round(h*sc));
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      try{ edlg.img=cv.toDataURL('image/jpeg',0.72); }
      catch(e2){ edlg.img=''; uiAlert('提示', '图片处理失败，请换一张试试'); }
      renderEDlg();
    };
    im.onerror=function(){ uiAlert('提示', '这张图片无法识别，请换一张（建议 jpg / png）'); };
    im.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function saveDish(){
  syncEDlg();
  var name=String(edlg.name||'').trim();
  if(!name){ uiAlert('提示', '请填写菜品名称'); return; }
  var price=parseFloat(edlg.price); if(isNaN(price)||price<0) price=0;
  var sp=edlg.specs.filter(function(s){ return String(s.n||'').trim(); })
                  .map(function(s){ return {n:String(s.n).trim(), p:(parseFloat(s.p)||0)}; });
  var specs=null, specPrice=null;
  if(sp.length){
    specs=sp.map(function(s){ return {n:s.n, add:0}; });
    specPrice={}; sp.forEach(function(s){ specPrice[s.n]=s.p; });
  }
  var cat=String(edlg.cat||'').trim()||'未分类';
  var obj={ id: edlg.id || ('d'+Date.now().toString().slice(-8)),
    cat:cat, name:name, emoji:edlg.emoji||'🍽️', img:edlg.img||'',
    price:Math.round(price*10)/10, cost:Math.max(0, parseFloat(edlg.cost)||0),
    unit:String(edlg.unit||'').trim(),
    desc:String(edlg.desc||'').trim(), specs:specs, specPrice:specPrice };
  var backupMenu=JSON.stringify(S.menu), backupCats=JSON.stringify(S.cats||[]);
  if(edlg.id){
    var done=false;
    S.menu.forEach(function(d,i){ if(d.id===edlg.id){ S.menu[i]=obj; done=true; } });
    if(!done) S.menu.push(obj);
  } else {
    S.menu.push(obj);
  }
  if(!S.cats) S.cats=[];
  if(S.cats.indexOf(cat)<0) S.cats.push(cat);
  if(!save()){
    S.menu=JSON.parse(backupMenu); S.cats=JSON.parse(backupCats);
    uiAlert('保存失败', '本机浏览器存储空间不足，未能保存。\n请删除部分菜品照片，或减少菜品数量后再试。');
    render(); return;
  }
  closeEDlg(); render();
}

function doLogin(){
  var u = normUser(val('lgUser')), p = val('lgPass');
  lgErr('');
  if(!u){ lgErr('请输入本组账号，如 3'); return; }
  if(!p){ lgErr('请输入密码'); return; }

  if(!acctWrite(m)){ lgErr('本机浏览器存储不可用，无法保存账号'); return; }

    uiConfirm('发现旧数据', '检测到本机还有一份未归属账号的旧数据，是否复制到「' + groupName() + '」？', function(){
      try{ localStorage.setItem(lsKey(), legacy); }catch(e){}

  if(!t) return null;

  if(k < 0) return null;
  body = t.slice(0, k);
  if(checksum36(body) !== t.slice(k + 1)) return null;   /* 链接残缺 */
  seg = splitEsc(body, '|');
  if(seg.length < 7) return null;
  p = { v: parseInt(seg[0], 10) || 1, u: seg[1], s: seg[2], gn: seg[3],
        c: splitEsc(seg[4], ','), ids: splitEsc(seg[5], ','), m: [] };
  rows = splitEsc(seg[6], ';');
  for(i = 0; i < rows.length; i++){
    if(!rows[i]) continue;
    var a = splitEsc(rows[i], ',');
    if(a.length < 8) continue;
    p.m.push([parseInt(a[0], 10) || 0, a[1], a[2], a[3], a[4], a[5], a[6], a[7]]);
  }
  if(!p.m.length) return null;
  return p;
}
/* 组 Takeaway：第 N 组（供顾客端显示） */
function guestGroupName(u, nm){
  if(nm) return displayName(u, '');

}
/* 逐档降级：完整 → 缩描述 → 去描述 → 去规格 → 仅菜名与价格
   目标是让最终网址短到手机一扫就开 */
var QR_TARGET = 620;    /* 网址字符数软目标，超出就往下一档精简 */
var QR_LEVELS = [
  [18, true,  true,  '完整菜单'],
  [10, true,  true,  '描述缩到 10 字'],
  [0,  true,  true,  '略去菜品描述'],
  [0,  false, true,  '略去规格与描述'],
  [0,  false, false, '仅保留菜名与价格']
];
function shareURL(){
  return shareInfo().url;
}
function shareInfo(){
  var best = null, i, txt, url;
  for(i = 0; i < QR_LEVELS.length; i++){
    txt = packTight(QR_LEVELS[i][0], QR_LEVELS[i][1], QR_LEVELS[i][2]);
    url = SHARE_BASE + '&g=' + encodeURIComponent(ACC || '') + '&z=1'
      + (OPEN_STATE ? '' : '&cl=1') + '&d=' + b64uEnc(lzEnc(txt));
    if(best === null || url.length < best.url.length) best = { url: url, lv: i, name: QR_LEVELS[i][3], raw: txt.length };
    if(url.length <= QR_TARGET) return best;
  }
  return best;
}
function drawQR(cv, text, px){
  if(typeof qrcode !== 'function') return false;
  var qr;
  try{ qr = qrcode(0, 'M'); qr.addData(text); qr.make(); }
  catch(e){ return false; }
  var n = qr.getModuleCount(), quiet = 4;
  var cell = Math.max(2, Math.floor(px / (n + quiet * 2)));
  var size = (n + quiet * 2) * cell;
  cv.width = size; cv.height = size;
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  if(!cv.getContext) return false;
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#1F2733';
  for(var r = 0; r < n; r++) for(var c = 0; c < n; c++) if(qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
  return true;
}
function qrModules(text){
  try{ var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.getModuleCount(); }
  catch(e){ return 0; }
}
function paintQRs(){
  var list = document.querySelectorAll('canvas[data-qr]'), i;
  for(i = 0; i < list.length; i++){
    var cv = list[i], txt = cv.getAttribute('data-qr');
    if(cv._q === txt) continue;
    if(drawQR(cv, txt, parseInt(cv.getAttribute('data-qrpx') || '180', 10))) cv._q = txt;
  }
}

/* ================= 开放时间日程（自动开、自动关，学期永不再发布） =================
   改开放时间只改下面这一段，然后发布一次，整学年都不用再管：学期结束当天自动关闭，
   新学期开学当天自动开放，期间的节假日、非授课时段也可以一并挡掉。

     windows  起止日期窗口，可写多段（一学期一段）。例：[['2026-09-07','2027-01-18']]
              填 [] 表示不启用日程，退回手工开关。
     weekly   每周的开放时段，按课时排课最有用。d = 1 周一 … 7 周日
              例：[{d:1,s:'08:00',e:'11:30'},{d:4,s:'13:30',e:'16:00'}]
              填 [] 表示窗口内每天都开，不看星期与钟点。
     daily    每天的开放时段。例：{s:'07:30',e:'17:00'}；不用就填 null。
     holidays 这几日一律关闭（放假、考试周、调休）。例：['2026-10-01','2026-10-02'] */
var SCHEDULE = {
  windows:  [ ['2026-09-01', '2027-01-25'] ],   /* 2026–2027 学年第一学期（开学 9 月初 — 学期结束 1 月底） */
  weekly:   [],
  daily:    null,
  holidays: []
};

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function timeStr(d){ return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function dowOf(d){ var w = d.getDay(); return w === 0 ? 7 : w; }
var DOW_CN = ['', '一', '二', '三', '四', '五', '六', '日'];

/* 按本机时间判断现在该不该开放，返回 {open, reason}
   reason 直接说给敲门的人听，所以要把「什么时候还会开放」讲清楚 */
function evalSchedule(now){
  var res = { open:true, reason:'' }, d = now || new Date();
  var W = (SCHEDULE && SCHEDULE.windows) || [], i;
  if(!W.length) return res;                                     /* 没配日期 → 日程不生效 */
  var t = dateStr(d), win = null;
  for(i = 0; i < W.length; i++){ if(t >= W[i][0] && t <= W[i][1]){ win = W[i]; break; } }
  if(!win){
    res.open = false;
    res.reason = (t < W[0][0])
      ? ('本系统的开放时间是 ' + W[0][0] + ' 至 ' + W[0][1] + '，还没到开始日期。')
      : ('本学期已结束（开放时间为 ' + W[W.length - 1][0] + ' 至 ' + W[W.length - 1][1] + '），系统已自动关闭。');
    return res;
  }
  var hol = (SCHEDULE && SCHEDULE.holidays) || [];
  for(i = 0; i < hol.length; i++){
    if(t === hol[i]){ res.open = false; res.reason = '今天（' + hol[i] + '）不在开放范围内。'; return res; }
  }
  var hm = timeStr(d);
  var wk = (SCHEDULE && SCHEDULE.weekly) || [];
  if(wk.length){
    var dow = dowOf(d), segs = [], hit = false;
    for(i = 0; i < wk.length; i++){
      if(wk[i].d !== dow) continue;
      segs.push(wk[i].s + '-' + wk[i].e);
      if(hm >= wk[i].s && hm <= wk[i].e) hit = true;
    }
    if(!hit){
      res.open = false;
      res.reason = segs.length
        ? ('今天是周' + DOW_CN[dow] + '，开放时段为 ' + segs.join('、') + '，现在不在开放时间内。')
        : ('今天（周' + DOW_CN[dow] + '）没有安排课时，系统暂不开放。');
      return res;
    }
  }
  var dy = SCHEDULE && SCHEDULE.daily;
  if(dy && dy.s && dy.e && (hm < dy.s || hm > dy.e)){
    res.open = false;
    res.reason = '今天的开放时段为 ' + dy.s + ' 至 ' + dy.e + '，现在不在开放时间内。';
    return res;
  }
  return res;
}
/* 一句话讲清开放安排，显示在登录页底部 */
function schedSummary(){
  var W = (SCHEDULE && SCHEDULE.windows) || [];
  if(!W.length) return '';
  var s = '开放日期：' + W[0][0] + ' 至 ' + W[0][1];
  if(W.length > 1) s += '（共 ' + W.length + ' 段）';
  var wk = SCHEDULE.weekly || [];
  if(wk.length){
    var g = {};
    wk.forEach(function(x){ (g[x.d] = g[x.d] || []).push(x.s + '-' + x.e); });
    var parts = [];
    Object.keys(g).forEach(function(k){ parts.push('周' + DOW_CN[+k] + ' ' + g[k].join('、')); });
    s += '<br>开放时段：' + parts.join('；');
  }else if(SCHEDULE.daily && SCHEDULE.daily.s){
    s += '<br>每日 ' + SCHEDULE.daily.s + ' 至 ' + SCHEDULE.daily.e;
  }else{
    s += '<br>开放期间全天可用';
  }
  return s;
}

  var t = schedSummary();

/* 全局锁：读线上 status.txt（内容形如 closed|原因 或 open|）
   取不到 / 超时一律视为开放，保证断网时系统照常可用 */
function gateCheck(cb){
  var done = false, timer = null;
  function fin(closed, reason){
    if(done) return; done = true;
    if(timer) clearTimeout(timer);
    if(closed){
      CLOSED_REASON = reason || '老师已暂时关闭本系统，请等待重新开放。';
      showClosed(CLOSED_REASON);
    }else{
      hideClosed();
    }
    if(cb) cb(!closed);
  }
  if(!isGuest){ fin(false); return; }          /* 教师本人不受限制 */
  if(typeof fetch !== 'function'){ fin(false); return; }
  try{
    timer = setTimeout(function(){ fin(false); }, 2500);
    fetch(SHARE_HOST + 'status.txt?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('nf'); return r.text(); })
      .then(function(txt){
        var seg = String(txt || '').split('|');
        var st = String(seg[0] || '').trim().toLowerCase();
        fin(st === 'closed' || st === 'off' || st === '0', String(seg[1] || '').trim());
      })
      .catch(function(){ fin(false); });
  }catch(e){ fin(false); }
}

/* ================= 整站访问闸门 =================
   与上面的「点单端闭店」不同：这一层挡的是整个系统——
   登录、首次建店、商家后台、顾客点单，关闭期间一律进不去。
   状态以线上 status.txt 为准（格式：closed|原因|口令哈希），
   取不到则退回本机开关；本机操作过开关的设备视为管理员设备，不受闸门拦截。 */
var LS_PIN_OK = 'emenu_pin_ok_v1';     /* 已通过口令的哈希，换口令即失效 */
var LS_ADMIN  = 'emenu_admin_v1';      /* 本机操作过总闸 → 管理员设备 */
var PIN_HASH  = 'yjc1fz';              /* 默认口令 2026 的哈希；status.txt 未带第三段时用这个兜底，保证教师永远进得去 */

function hash36(s){
  var c = 5381, i;
  s = String(s == null ? '' : s);
  for(i = 0; i < s.length; i++){ c = ((c << 5) + c + s.charCodeAt(i)) & 0x7FFFFFFF; }
  return c.toString(36);
}
function parseStatus(txt){
  var s = String(txt == null ? '' : txt).split('|');
  var st = String(s[0] || '').trim().toLowerCase();
  return {
    closed: (st === 'closed' || st === 'off' || st === '0'),
    reason: String(s[1] || '').trim(),
    hash: String(s[2] || '').trim()
  };
}
function fetchStatus(cb){
  if(typeof fetch !== 'function'){ cb(null); return; }
  var done = false, timer = null;
  function fin(v){ if(done) return; done = true; if(timer) clearTimeout(timer); cb(v); }
  try{
    timer = setTimeout(function(){ fin(null); }, 2500);
    fetch(SHARE_HOST + 'status.txt?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('nf'); return r.text(); })
      .then(function(t){ fin(parseStatus(t)); })
      .catch(function(){ fin(null); });
  }catch(e){ fin(null); }
}
function isAdminDevice(){

}

}
function pinPassed(hash){
  if(!hash) return false;
  var v = null;
  try{ v = localStorage.getItem(LS_PIN_OK); }catch(e){}

}
function hideGate(){

/* 启动前先过闸：关着就停在这里，什么都不渲染 */
function gateBoot(cb){
  var localClosed = !OPEN_STATE;
  /* 管理员设备且本机是开放态：直接放行，不再等网络 */
  if(isAdminDevice() && !localClosed){ hideGate(); cb(true); return; }
  fetchStatus(function(st){
    var sch = evalSchedule();
    var closed = localClosed || !!(st && st.closed) || !sch.open;
    if(!closed){ hideGate(); cb(true); return; }
    /* 本机自己关的：操作者即管理员，不锁自己 */
    if(localClosed && isAdminDevice()){ hideGate(); cb(true); return; }
    var hash = (st && st.hash) || PIN_HASH;
    if(pinPassed(hash)){ hideGate(); cb(true); return; }
    /* 优先讲人手关闭的原因，其次才是时间日程 */
    showGate((localClosed ? '' : ((st && st.closed && st.reason) || sch.reason)) || '', hash);
    cb(false);
  });
}

/* ================= 启动 ================= */
function parseURL(){
  var q = {}, s = String(location.search || '').replace(/^\?/, '');
  if(s) s.split('&').forEach(function(kv){

    try{ q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); }catch(e){}
  });
  return q;
}

  var q0 = parseURL(), p = null, badLink = false;
  if(q0.d && q0.z){
    try{ p = unpackTight(lzDec(b64uDec(q0.d))); }catch(e){ p = null; }
    if(!p) badLink = true;

  if(!p){ var hp = parseHashPayload(); if(hp && hp.m && hp.c) p = hp; }
  if(p && p.m && p.c){
    ACC = normUser(p.u || q0.g || '');

    if(p.t){ curTable = String(p.t).replace(/[<>"'&\\]/g, '').slice(0, 12) || 'A01'; }
    ensureTable(curTable);
    /* 二维码里带闭店标记：本组老师关闭了点单端。
       在还原菜单之前就拦下，菜单数据不会落到这台设备上 */
    if(q0.cl === '1'){
      showClosed('「' + GUEST_GROUP + '」的老师已暂停点单，请等待重新开放。');
      return;
    }
    var old = null;
    try{ old = JSON.parse(localStorage.getItem(lsKey()) || 'null'); }catch(e){}
    S = { seq:(old && old.seq) || 100, cats:p.c || [], menu:unpackMenu(p) || [], orders:(old && old.orders) || [] };
    save();

    toast('已进入「' + GUEST_GROUP + '」的点餐页');
    return;
  }
  if(badLink){
    uiAlert('二维码链接不完整', '这个网址在转发/复制过程中被截断了，菜单数据没法还原。\n\n请回到本组的「点单二维码」页面重新生成二维码，'
      + '直接截图发给同学扫描，不要把网址手动复制来复制去。');
  }
  var q = parseURL();
  if(q.t || q.u){
    ACC = normUser(q.u || '');
    isGuest = true;
    var m = acctMap();
    ACC_NAME = ACC ? displayName(ACC, m[ACC] && m[ACC].nm) : '顾客体验';
    if(ACC && m[ACC] && m[ACC].nm) ACC_NAME = m[ACC].nm;
    GUEST_GROUP = guestGroupName(ACC, '');
    if(q.t){
      q.t = String(q.t).replace(/[<>"'&\\]/g, '').slice(0, 12) || 'A01';
      curTable = q.t;
      ensureTable(curTable);
    }
    S = load();
    showApp();
    takeOrderLink();
    gateCheck();
    if(q.t) toast('已进入 ' + curTable + ' 桌点餐页');
    return;
  }
  var saved = null;
  try{ saved = localStorage.getItem(LS_LOGIN); }catch(e){}
  if(saved && acctMap()[saved]){
    ACC = saved;
    ACC_NAME = displayName(saved, acctMap()[saved].nm);
    S = load();
    showApp();
    takeOrderLink();
    return;
  }
  hideApp();
  showLogin();
}

/* ================= 渲染入口 & 跨窗口同步 ================= */
function render(){
  if(view==='g') renderGuest(); else renderBoss();
  paintQRs();
}
window.addEventListener('storage', function(ev){
  if(ev.key===lsKey()){ S=load(); render(); }
});
initApp();
/* 每 30 秒刷新一次（更新"几分钟前"） */
setInterval(function(){ if(view==='b'&&subView==='kds') render(); }, 30000);
</script>
