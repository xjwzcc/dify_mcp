<title>吴山苑 · 教学实训平台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#183128;background:#f4f6f1;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:64px 24px}header{margin-bottom:42px}.label{font-size:13px;letter-spacing:3px;color:#566f5e}h1{font-size:clamp(30px,5vw,48px);line-height:1.3;margin:16px 0}header p{color:#607065}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{background:white;border:1px solid #dce3da;border-radius:18px;padding:32px;box-shadow:0 12px 32px #23422a08}h2{font-size:25px;margin:12px 0}article p{color:#607065;min-height:58px}.number{font-size:12px;color:#687c6e;letter-spacing:2px}.links{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}a{display:inline-block;border-radius:8px;padding:12px 22px;text-decoration:none;color:#fff;background:#245a43;font-weight:600}a.teacher{background:#edf3eb;color:#245a43}a:hover{filter:brightness(.94)}a:focus-visible{outline:3px solid #b98524;outline-offset:4px}footer{margin-top:32px;font-size:14px;color:#65766b}@media(max-width:650px){main{padding:36px 18px}section{grid-template-columns:1fr}article{padding:24px}}

<body><main>
<header><div class="label">吴山苑酒店 · 教学实训</div><h1>从课堂出发，走进酒店业务。</h1><p>使用统一账号关联两门课程，保留个人学习与教学记录。</p><div class="links"><a href="/accounts/">统一账号登录</a><a class="teacher" href="/accounts/#register">学生 / 教师注册</a></div></header>
<section aria-label="实训课程">
<article><span class="number">01 / 餐饮服务</span><h2>餐饮信息系统</h2><p>电子菜单、点餐下单、后厨协作与经营复盘。记录操作过程，完成任务提交与教学评价。</p><div class="links"><a href="/catering/student">进入学生端</a><a class="teacher" href="/catering/teacher">进入教师端</a></div></article>
<article><span class="number">02 / 酒店管理</span><h2>酒店人力资源系统</h2><p>招聘、排班、薪酬、绩效与培训。支持班级管理、阶段开放、实训任务与师生交流。</p><div class="links"><a href="/hotel/student">进入学生端</a><a class="teacher" href="/hotel/teacher">进入教师端</a></div></article>
</section>
<footer>已有课程账号可在账号中心验证原密码后绑定；新学生加入课程需要班级口令，教师注册需要邀请码。下方课程入口仍支持原账号登录。</footer>
</main></body></html>
