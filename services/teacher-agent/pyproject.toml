[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-demo"
version = "0.1.0"
description = "Durable Codex CLI and DeepSeek chat with isolated execution"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1",
  "SQLAlchemy==2.0.40", "jsonschema==4.23.0",
  "boto3==1.38.0", "pymysql==1.1.1",
  "oss2==2.19.1",
]

[project.optional-dependencies]
fc = ["e2b==2.31.0"]
test = ["pytest==8.3.5"]

[project.scripts]
agent-demo = "agent_demo.cli:main"

[tool.setuptools.packages.find]
include = ["agent_demo*"]

[tool.setuptools.package-data]
agent_demo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
